<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA OCC</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10141a;
    color: #ffffff;
}

header {
    height: 70px;
    background: #171d25;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #303844;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.cloud {
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #00e676;
    box-shadow: 0 0 10px #00e676;
}

main {
    padding: 25px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: #181f28;
    border: 1px solid #303844;
    border-radius: 10px;
    padding: 18px;
}

.card-title {
    color: #9da7b3;
    font-size: 13px;
}

.card-value {
    font-size: 28px;
    margin-top: 8px;
    font-weight: bold;
}

.devices {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 20px;
}

.device {
    background: #181f28;
    border: 1px solid #303844;
    border-radius: 12px;
    padding: 20px;
}

.device.online {
    border-color: #00c853;
}

.device.offline {
    opacity: 0.55;
}

.device-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.motor-name {
    font-size: 21px;
    font-weight: bold;
}

.pi-id {
    color: #8994a3;
    font-size: 12px;
    margin-top: 4px;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.status.online {
    background: #063d21;
    color: #00e676;
}

.status.offline {
    background: #3b1717;
    color: #ff5252;
}

.data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.data {
    background: #11161d;
    padding: 12px;
    border-radius: 7px;
}

.data-label {
    color: #8994a3;
    font-size: 11px;
}

.data-value {
    margin-top: 5px;
    font-size: 17px;
    font-weight: bold;
}

.controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

button {
    border: none;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    color: white;
}

button:hover {
    filter: brightness(1.15);
}

.remote {
    background: #1565c0;
}

.start {
    background: #00897b;
}

.stop {
    background: #d32f2f;
}

.relay-on {
    background: #2e7d32;
}

.relay-off {
    background: #6d1b1b;
}

.local {
    background: #455a64;
}

.event {
    margin-top: 15px;
    padding: 10px;
    background: #0d1117;
    border-radius: 7px;
    font-size: 12px;
    color: #aeb8c4;
}

.empty {
    padding: 50px;
    text-align: center;
    color: #7d8794;
}

@media(max-width:900px) {
    .summary {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:600px) {
    .summary {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="title">
        SCADA OCC
    </div>

    <div class="cloud">
        <span id="cloudDot" class="dot"></span>
        <span id="cloudText">Connecting...</span>
    </div>

</header>

<main>

<div class="summary">

    <div class="card">
        <div class="card-title">TOTAL DEVICES</div>
        <div class="card-value" id="totalDevices">0</div>
    </div>

    <div class="card">
        <div class="card-title">ONLINE</div>
        <div class="card-value" id="onlineDevices">0</div>
    </div>

    <div class="card">
        <div class="card-title">MOTORS RUNNING</div>
        <div class="card-value" id="runningMotors">0</div>
    </div>

    <div class="card">
        <div class="card-title">TOTAL CURRENT</div>
        <div class="card-value" id="totalCurrent">0.000 A</div>
    </div>

</div>

<div id="devices" class="devices">

    <div class="empty">
        Waiting for Raspberry Pi devices...
    </div>

</div>

</main>

<script>

/* =========================================================
   FIREBASE CONFIGURATION
   ========================================================= */

const firebaseConfig = {

    apiKey: "YOUR_FIREBASE_WEB_API_KEY",

    authDomain:
        "monitoring-3fb9f.firebaseapp.com",

    databaseURL:
        "https://monitoring-3fb9f-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "monitoring-3fb9f",

    storageBucket:
        "monitoring-3fb9f.appspot.com",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_FIREBASE_APP_ID"
};


/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let devices = {};


/* =========================================================
   FIREBASE LOGIN
   ========================================================= */

auth.signInAnonymously()
.then(() => {

    console.log("Firebase authentication successful");

    setCloudStatus(true);

    startDeviceListener();

})
.catch(error => {

    console.error(error);

    setCloudStatus(false);

    document.getElementById("cloudText").textContent =
        "Firebase authentication failed";

});


/* =========================================================
   CLOUD STATUS
   ========================================================= */

function setCloudStatus(online) {

    const dot =
        document.getElementById("cloudDot");

    const text =
        document.getElementById("cloudText");

    if (online) {

        dot.classList.add("online");

        text.textContent = "Firebase ONLINE";

    } else {

        dot.classList.remove("online");

        text.textContent = "Firebase OFFLINE";

    }

}


/* =========================================================
   DEVICE LISTENER
   ========================================================= */

function startDeviceListener() {

    db.ref("scada/devices").on(

        "value",

        snapshot => {

            devices = snapshot.val() || {};

            renderDevices();

        },

        error => {

            console.error(error);

            setCloudStatus(false);

        }

    );

}


/* =========================================================
   RENDER DEVICES
   ========================================================= */

function renderDevices() {

    const container =
        document.getElementById("devices");

    container.innerHTML = "";

    const ids =
        Object.keys(devices);

    let onlineCount = 0;

    let runningCount = 0;

    let totalCurrent = 0;


    if (ids.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No Raspberry Pi connected
             </div>`;

        updateSummary(
            0,
            0,
            0,
            0
        );

        return;
    }


    ids.forEach(id => {

        const d = devices[id] || {};

        const online =
            d.online === true;

        if (online)
            onlineCount++;


        const current =
            Number(d.current || 0);

        totalCurrent += current;


        if (
            online &&
            String(d.motor_status).toUpperCase() === "RUNNING"
        ) {

            runningCount++;

        }


        const card =
            document.createElement("div");

        card.className =
            "device " +
            (online ? "online" : "offline");


        card.innerHTML = `

            <div class="device-header">

                <div>

                    <div class="motor-name">
                        ${escapeHTML(
                            d.motor_name || "UNKNOWN MOTOR"
                        )}
                    </div>

                    <div class="pi-id">
                        ${escapeHTML(id)}
                    </div>

                </div>

                <div class="status ${
                    online ? "online" : "offline"
                }">

                    ${
                        online
                        ? "ONLINE"
                        : "OFFLINE"
                    }

                </div>

            </div>


            <div class="data-grid">

                <div class="data">

                    <div class="data-label">
                        CURRENT
                    </div>

                    <div class="data-value">
                        ${current.toFixed(3)} A
                    </div>

                </div>


                <div class="data">

                    <div class="data-label">
                        MOTOR
                    </div>

                    <div class="data-value">
                        ${escapeHTML(
                            d.motor_status || "STOPPED"
                        )}
                    </div>

                </div>


                <div class="data">

                    <div class="data-label">
                        MODE
                    </div>

                    <div class="data-value">
                        ${escapeHTML(
                            d.mode || "LOCAL"
                        )}
                    </div>

                </div>


                <div class="data">

                    <div class="data-label">
                        RELAY
                    </div>

                    <div class="data-value">
                        ${escapeHTML(
                            d.relay || "OFF"
                        )}
                    </div>

                </div>


                <div class="data">

                    <div class="data-label">
                        LOCATION
                    </div>

                    <div class="data-value">
                        ${escapeHTML(
                            d.location || "-"
                        )}
                    </div>

                </div>


                <div class="data">

                    <div class="data-label">
                        LAST SEEN
                    </div>

                    <div class="data-value">

                        ${
                            formatTime(
                                d.last_seen
                            )
                        }

                    </div>

                </div>

            </div>


            <div class="controls">

                <button
                    class="remote"
                    onclick="sendCommand(
                        '${id}',
                        'MODE_REMOTE'
                    )">

                    REMOTE MODE

                </button>


                <button
                    class="local"
                    onclick="sendCommand(
                        '${id}',
                        'MODE_LOCAL'
                    )">

                    LOCAL MODE

                </button>


                <button
                    class="start"
                    onclick="sendCommand(
                        '${id}',
                        'START'
                    )">

                    START MOTOR

                </button>


                <button
                    class="stop"
                    onclick="sendCommand(
                        '${id}',
                        'STOP'
                    )">

                    STOP MOTOR

                </button>


                <button
                    class="relay-on"
                    onclick="sendCommand(
                        '${id}',
                        'RELAY_ON'
                    )">

                    RELAY ON

                </button>


                <button
                    class="relay-off"
                    onclick="sendCommand(
                        '${id}',
                        'RELAY_OFF'
                    )">

                    RELAY OFF

                </button>

            </div>


            <div class="event">

                PI:
                ${escapeHTML(id)}

                <br>

                Command path:
                scada/commands/${escapeHTML(id)}

            </div>

        `;


        container.appendChild(card);

    });


    updateSummary(

        ids.length,

        onlineCount,

        runningCount,

        totalCurrent

    );

}


/* =========================================================
   SEND COMMAND
   ========================================================= */

function sendCommand(piId, command) {

    if (!piId)
        return;


    const commandData = {

        command: command,

        timestamp:
            firebase.database.ServerValue.TIMESTAMP

    };


    db.ref(
        "scada/commands/" + piId
    )
    .set(commandData)

    .then(() => {

        console.log(
            "Command sent:",
            piId,
            command
        );

    })

    .catch(error => {

        console.error(
            "Command failed:",
            error
        );

        alert(
            "Command failed: " +
            error.message
        );

    });

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary(
    total,
    online,
    running,
    current
) {

    document.getElementById(
        "totalDevices"
    ).textContent = total;


    document.getElementById(
        "onlineDevices"
    ).textContent = online;


    document.getElementById(
        "runningMotors"
    ).textContent = running;


    document.getElementById(
        "totalCurrent"
    ).textContent =
        current.toFixed(3) + " A";

}


/* =========================================================
   TIME
   ========================================================= */

function formatTime(timestamp) {

    if (!timestamp)
        return "-";


    const date =
        new Date(timestamp);


    return date.toLocaleTimeString(
        "en-IN",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
