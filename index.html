<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRPSP Secure BMS</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* VISUAL DESIGN */
        :root {
            --bg-color: #F3F6FA; --card-bg: #FFFFFF;
            --text-main: #333333; --text-muted: #666666; --border-color: #E2E8F0;
            --primary: #0056b3; --online-color: #28a745; --offline-color: #dc3545;
            --warning-color: #ffc107; --alarm-color: #dc3545;
            --sidebar-width: 280px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* TYPOGRAPHY */
        .header-title { font-size: 32px; font-weight: 600; color: var(--primary); margin-bottom: 5px; }
        .page-title { font-size: 30px; font-weight: 500; margin-bottom: 20px; }
        .subtitle { font-size: 18px; color: var(--text-muted); margin-bottom: 20px; }
        .room-name { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .value-large { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .label { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* LAYOUT */
        #sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-header { padding: 30px 20px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 24px; color: var(--primary); }
        .nav-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
        .nav-item { padding: 15px 25px; font-size: 20px; cursor: pointer; display: flex; gap: 15px; transition: background 0.2s; }
        .nav-item:hover, .nav-item.active { background: #EBF4FF; color: var(--primary); border-right: 4px solid var(--primary); }
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }
        #main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 40px; width: calc(100% - var(--sidebar-width)); }

        /* COMPONENTS */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-weight: bold; background: var(--card-bg); border: 1px solid var(--border-color); }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-online { background: var(--online-color); } .dot-offline { background: var(--offline-color); }
        
        .btn { padding: 12px 24px; font-size: 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; color: white; background: var(--primary); }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--online-color); } .btn-danger { background: var(--offline-color); } .btn-secondary { background: #6c757d; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .room-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .metric-box { background: var(--bg-color); padding: 15px; border-radius: 8px; text-align: center; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; background: var(--card-bg); }
        .control-panel { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        
        .toast { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; padding: 15px 25px; border-radius: 8px; font-size: 18px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .hidden { display: none !important; }
        .text-online { color: var(--online-color); font-weight: bold; } .text-offline { color: var(--offline-color); font-weight: bold; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header"><h2>SECURE<br>BMS</h2></div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="navigate('dashboard')">🏢 Dashboard</li>
            <li class="nav-item" onclick="navigate('register')">📡 Register ESP</li>
            <li class="nav-item" onclick="navigate('registered')">📋 Registered</li>
            <li class="nav-item" onclick="navigate('system')">⚙️ System</li>
        </ul>
        <div class="sidebar-footer">
            <div class="label">Online Controllers</div>
            <div class="value-large" id="sidebar-online-count" style="font-size: 28px;">0</div>
        </div>
    </aside>

    <main id="main-content">
        <div class="top-bar">
            <div>
                <h1 class="header-title">STRICT SECURE BMS</h1>
                <div class="subtitle">Only Authorized ESPs Displayed</div>
            </div>
            <div class="status-badge">
                <div class="status-dot dot-offline" id="system-status-dot"></div>
                <span id="system-status-text">DISCONNECTED</span>
            </div>
        </div>
        <div id="screen-container"></div>
    </main>

    <div id="toast" class="toast">Action completed</div>

    <script>
        // STRICT AUTHENTICATION TOKEN (Must match ESP code exactly)
        const EXPECTED_TOKEN = "MRPSP_AUTH_999";
        const MQTT_BROKER = "wss://test.mosquitto.org:8081/mqtt";
        const STORAGE_KEY = "SECURE_BMS_DEVICES";

        const state = {
            registeredDevices: [], 
            detectedDevices: {},   
            currentScreen: 'dashboard',
            selectedDeviceId: null,
            mqttClient: null
        };

        function initApp() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) state.registeredDevices = JSON.parse(stored);
            connectMQTT();
            renderScreen();
        }

        function saveRegistrations() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.registeredDevices));
            updateSidebarStats();
        }

        function connectMQTT() {
            setSystemStatus(false, "CONNECTING...");
            state.mqttClient = mqtt.connect(MQTT_BROKER);

            state.mqttClient.on("connect", () => {
                setSystemStatus(true, "SYSTEM ONLINE");
                // New completely clean topic for strict tracking
                state.mqttClient.subscribe("mrpsp/secure_bms/+/data");
                state.mqttClient.subscribe("mrpsp/secure_bms/+/status");
            });

            state.mqttClient.on("close", () => setSystemStatus(false, "DISCONNECTED"));
            state.mqttClient.on("message", (topic, payload) => handleMqttMessage(topic, payload.toString()));
        }

        function handleMqttMessage(topic, message) {
            const parts = topic.split("/");
            if (parts.length !== 4) return;
            
            const deviceId = parts[2]; // Hardware ID
            const type = parts[3];     // data or status

            // Initialize device if we haven't seen it
            if (!state.detectedDevices[deviceId]) {
                state.detectedDevices[deviceId] = {
                    device_id: deviceId, block_name: "Unknown",
                    status: 'OFFLINE', supply: 'OFF', fault: 'NO',
                    voltage: 0, current: 0, power: 0, rssi: 0
                };
            }

            const device = state.detectedDevices[deviceId];

            if (type === 'data') {
                try {
                    const data = JSON.parse(message);
                    
                    // ============================================================
                    // SECURITY CHECK: INSTANTLY REJECT FAKE DATA
                    // ============================================================
                    if (data.token !== EXPECTED_TOKEN) {
                        console.warn(`Rejected unauthorized data from ${deviceId}`);
                        return; 
                    }

                    device.status = 'ONLINE'; // Data arrived, so it's online
                    if (data.block_name) device.block_name = data.block_name;
                    if (data.supply) device.supply = data.supply;
                    if (data.voltage !== undefined) device.voltage = data.voltage;
                    if (data.current !== undefined) device.current = data.current;
                    if (data.power !== undefined) device.power = data.power;
                    if (data.rssi !== undefined) device.rssi = data.rssi;
                    if (data.fault) device.fault = data.fault;
                    
                } catch (e) {
                    return; // Ignore bad JSON silently
                }
            } else if (type === 'status') {
                device.status = message.trim().toUpperCase();
            }

            updateUI(deviceId);
        }

        function publishCommand(deviceId, command) {
            const topic = `mrpsp/secure_bms/${deviceId}/command`;
            state.mqttClient.publish(topic, command);
            showToast(`Sent ${command} to ${deviceId}`);
        }

        function updateUI(deviceId) {
            updateSidebarStats();
            const dev = state.detectedDevices[deviceId];
            if (!dev) return;

            if (state.currentScreen === 'dashboard' && isRegistered(deviceId)) {
                let card = document.getElementById(`card-${deviceId}`);
                if (dev.status === 'ONLINE') {
                    if (card) {
                        document.getElementById(`v-${deviceId}`).innerText = dev.voltage.toFixed(1) + ' V';
                        document.getElementById(`c-${deviceId}`).innerText = dev.current.toFixed(2) + ' A';
                        document.getElementById(`p-${deviceId}`).innerText = dev.power.toFixed(1) + ' W';
                        document.getElementById(`s-${deviceId}`).innerText = dev.supply;
                        document.getElementById(`s-${deviceId}`).className = dev.supply === 'ON' ? 'text-online' : 'text-muted';
                    } else {
                        renderScreen(); // Force draw if card doesn't exist yet
                    }
                } else if (card) {
                    card.remove(); // Remove immediately if offline
                }
                checkDashboardEmpty();
            }
            else if (state.currentScreen === 'room_detail' && state.selectedDeviceId === deviceId) {
                document.getElementById('rd-v').innerText = dev.voltage.toFixed(1) + ' V';
                document.getElementById('rd-c').innerText = dev.current.toFixed(2) + ' A';
                document.getElementById('rd-p').innerText = dev.power.toFixed(1) + ' W';
                document.getElementById('rd-supply').innerText = dev.supply;
                document.getElementById('rd-offline').className = dev.status === 'ONLINE' ? 'hidden' : '';
            }
            else if (state.currentScreen === 'register') {
                const list = document.getElementById('reg-list');
                if (list) list.innerHTML = buildRegisterList();
            }
        }

        // --- NAVIGATION & RENDERING ---
        function navigate(screen, params = null) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            state.currentScreen = screen;
            state.selectedDeviceId = params;
            renderScreen();
        }

        function renderScreen() {
            const container = document.getElementById("screen-container");
            container.innerHTML = "";
            if (state.currentScreen === 'dashboard') renderDashboard(container);
            if (state.currentScreen === 'register') renderRegister(container);
            if (state.currentScreen === 'registered') renderRegistered(container);
            if (state.currentScreen === 'room_detail') renderRoomDetail(container);
            if (state.currentScreen === 'system') renderSystem(container);
        }

        function renderDashboard(container) {
            container.innerHTML = `<h2 class="page-title">Active Block Controllers</h2><div id="grid" class="grid"></div>`;
            let grid = document.getElementById('grid');
            let count = 0;
            state.registeredDevices.forEach(reg => {
                const dev = state.detectedDevices[reg.device_id];
                if (dev && dev.status === 'ONLINE') {
                    grid.innerHTML += createCard(dev);
                    count++;
                }
            });
            container.innerHTML += `<div id="empty-dash" class="empty-state ${count>0?'hidden':''}"><h3>No active controllers connected</h3></div>`;
        }

        function createCard(dev) {
            return `
            <div class="card" id="card-${dev.device_id}">
                <div class="room-card-header">
                    <div>
                        <div class="room-name">${dev.block_name}</div>
                        <div class="label" style="font-size:12px;">HW ID: ${dev.device_id}</div>
                    </div>
                    <div class="status-badge"><div class="status-dot dot-online"></div><span class="text-online">ONLINE</span></div>
                </div>
                <div class="metrics-grid">
                    <div class="metric-box"><div class="label">Supply</div><div class="value-large ${dev.supply === 'ON' ? 'text-online' : 'text-muted'}" id="s-${dev.device_id}">${dev.supply}</div></div>
                    <div class="metric-box"><div class="label">Voltage</div><div class="value-large" id="v-${dev.device_id}">${dev.voltage.toFixed(1)} V</div></div>
                    <div class="metric-box"><div class="label">Current</div><div class="value-large" id="c-${dev.device_id}">${dev.current.toFixed(2)} A</div></div>
                    <div class="metric-box"><div class="label">Power</div><div class="value-large" id="p-${dev.device_id}">${dev.power.toFixed(1)} W</div></div>
                </div>
                <button class="btn" style="width:100%" onclick="navigate('room_detail', '${dev.device_id}')">MANAGE BLOCK</button>
            </div>`;
        }

        function renderRegister(container) {
            container.innerHTML = `
                <h2 class="page-title">Detect New Blocks</h2>
                <div class="subtitle">Only secure devices broadcasting the valid token appear here.</div>
                <div id="reg-list">${buildRegisterList()}</div>
            `;
        }

        function buildRegisterList() {
            let html = "";
            let count = 0;
            Object.keys(state.detectedDevices).forEach(id => {
                if (!isRegistered(id)) {
                    count++;
                    const dev = state.detectedDevices[id];
                    html += `
                    <div class="list-item">
                        <div>
                            <div class="room-name">${dev.block_name}</div>
                            <div class="label">Hardware ID: ${dev.device_id}</div>
                        </div>
                        <button class="btn btn-success" onclick="regESP('${dev.device_id}', '${dev.block_name}')">[ ADD TO SYSTEM ]</button>
                    </div>`;
                }
            });
            return count > 0 ? html : `<div class="empty-state">No new secure devices detected.</div>`;
        }

        function regESP(id, name) {
            state.registeredDevices.push({ device_id: id, block_name: name });
            saveRegistrations();
            showToast(`Added ${name}`);
            renderScreen();
        }

        function renderRegistered(container) {
            container.innerHTML = `<h2 class="page-title">Authorized Blocks</h2><div id="auth-list"></div>`;
            const list = document.getElementById('auth-list');
            if (state.registeredDevices.length === 0) list.innerHTML = `<div class="empty-state">No blocks authorized.</div>`;
            
            state.registeredDevices.forEach(reg => {
                list.innerHTML += `
                <div class="list-item">
                    <div>
                        <div class="room-name">${reg.block_name}</div>
                        <div class="label">Hardware ID: ${reg.device_id}</div>
                    </div>
                    <button class="btn btn-danger" onclick="delESP('${reg.device_id}')">[ REVOKE ACCESS ]</button>
                </div>`;
            });
        }

        function delESP(id) {
            state.registeredDevices = state.registeredDevices.filter(d => d.device_id !== id);
            saveRegistrations();
            renderScreen();
        }

        function renderRoomDetail(container) {
            const dev = state.detectedDevices[state.selectedDeviceId];
            if (!dev) return;
            
            container.innerHTML = `
                <button class="btn btn-secondary" style="margin-bottom: 20px;" onclick="navigate('dashboard')">← BACK TO DASHBOARD</button>
                <div class="card">
                    <h2 class="room-name" style="font-size:36px;">${dev.block_name}</h2>
                    <div class="label">Hardware ID: ${dev.device_id}</div>
                    
                    <div id="rd-offline" class="${dev.status === 'ONLINE' ? 'hidden' : ''}" style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin: 20px 0; font-weight: bold;">
                        ⚠️ DEVICE CURRENTLY OFFLINE OR DISCONNECTED
                    </div>

                    <div class="metrics-grid" style="margin-top:20px;">
                        <div class="metric-box"><div class="label">Supply</div><div class="value-large" id="rd-supply">${dev.supply}</div></div>
                        <div class="metric-box"><div class="label">Voltage</div><div class="value-large" id="rd-v">${dev.voltage.toFixed(1)} V</div></div>
                        <div class="metric-box"><div class="label">Current</div><div class="value-large" id="rd-c">${dev.current.toFixed(2)} A</div></div>
                        <div class="metric-box"><div class="label">Power</div><div class="value-large" id="rd-p">${dev.power.toFixed(1)} W</div></div>
                    </div>

                    <div class="control-panel">
                        <button class="btn btn-success" onclick="publishCommand('${dev.device_id}', 'ON')">TURN SUPPLY ON</button>
                        <button class="btn btn-danger" onclick="publishCommand('${dev.device_id}', 'OFF')">TURN SUPPLY OFF</button>
                    </div>
                </div>
            `;
        }

        function renderSystem(container) {
            container.innerHTML = `
                <h2 class="page-title">System Health</h2>
                <div class="card">
                    <h3>Authorized Devices: ${state.registeredDevices.length}</h3>
                    <h3 style="margin-top:10px;">Security: ENABLED (Token Matching Enforced)</h3>
                </div>
            `;
        }

        // --- UTILS ---
        function setSystemStatus(isOnline, text) {
            document.getElementById("system-status-text").innerText = text;
            document.getElementById("system-status-dot").className = `status-dot ${isOnline ? "dot-online" : "dot-offline"}`;
        }
        function updateSidebarStats() {
            const count = state.registeredDevices.filter(r => state.detectedDevices[r.device_id]?.status === 'ONLINE').length;
            document.getElementById("sidebar-online-count").innerText = count;
        }
        function isRegistered(id) { return state.registeredDevices.some(d => d.device_id === id); }
        function checkDashboardEmpty() {
            const e = document.getElementById('empty-dash');
            const g = document.getElementById('grid');
            if (e && g) e.className = g.children.length === 0 ? "empty-state" : "hidden";
        }
        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
