<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRPSP Building Management System</title>
    <!-- Include MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* ==========================================================
           VISUAL DESIGN & VARIABLES
           ========================================================== */
        :root {
            --bg-color: #F3F6FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #E2E8F0;
            
            --primary: #0056b3;
            --primary-hover: #004494;
            --online-color: #28a745;
            --offline-color: #dc3545;
            --warning-color: #ffc107;
            --alarm-color: #dc3545;
            
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 18px; 
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==========================================================
           TYPOGRAPHY
           ========================================================== */
        h1.header-title { font-size: 32px; font-weight: 600; color: var(--primary); margin-bottom: 5px; }
        h2.page-title { font-size: 30px; font-weight: 500; margin-bottom: 20px; }
        .subtitle { font-size: 18px; color: var(--text-muted); margin-bottom: 20px; }
        .room-name { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .value-large { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .label { font-size: 16px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* ==========================================================
           LAYOUT
           ========================================================== */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 24px;
            color: var(--primary);
            line-height: 1.2;
        }

        .nav-menu {
            list-style: none;
            padding: 20px 0;
            flex-grow: 1;
        }

        .nav-item {
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #EBF4FF;
            color: var(--primary);
            border-right: 4px solid var(--primary);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 16px;
        }

        #main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 40px;
            width: calc(100% - var(--sidebar-width));
        }

        /* ==========================================================
           COMPONENTS
           ========================================================== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-online { background-color: var(--online-color); }
        .dot-offline { background-color: var(--offline-color); }

        .btn {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
            background: var(--primary);
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--online-color); }
        .btn-danger { background: var(--offline-color); }
        .btn-secondary { background: #6c757d; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .metric-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            background: var(--card-bg);
        }

        .control-panel {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--text-main);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .hidden { display: none !important; }
        .text-online { color: var(--online-color); font-weight: bold; }
        .text-offline { color: var(--offline-color); font-weight: bold; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon { font-size: 64px; margin-bottom: 20px; }

        @media (max-width: 1024px) {
            :root { --sidebar-width: 240px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { position: static; width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            #main-content { margin-left: 0; width: 100%; padding: 20px; }
            .nav-menu { display: flex; flex-wrap: wrap; padding: 10px; }
            .nav-item { padding: 10px 15px; font-size: 16px; border-right: none; border-bottom: 4px solid transparent; }
            .nav-item:hover, .nav-item.active { border-bottom: 4px solid var(--primary); }
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>MRPSP<br>BMS</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="navigate('dashboard')">🏢 Dashboard</li>
            <li class="nav-item" onclick="navigate('register')">📡 Register ESP</li>
            <li class="nav-item" onclick="navigate('registered')">📋 Registered ESPs</li>
            <li class="nav-item" onclick="navigate('alarms')">⚠️ Alarms</li>
            <li class="nav-item" onclick="navigate('events')">📜 Events</li>
            <li class="nav-item" onclick="navigate('system')">⚙️ System</li>
        </ul>
        <div class="sidebar-footer">
            <div class="label">Registered Online</div>
            <div class="value-large" id="sidebar-online-count" style="font-size: 28px; margin: 5px 0;">00</div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content">
        <div class="top-bar">
            <div>
                <h1 class="header-title">MRPSP BUILDING MANAGEMENT SYSTEM</h1>
                <div class="subtitle">Remote Electrical Monitoring & Control</div>
            </div>
            <div class="status-badge" id="system-status-badge">
                <div class="status-dot dot-offline" id="system-status-dot"></div>
                <span id="system-status-text">MQTT DISCONNECTED</span>
            </div>
        </div>

        <!-- SCREEN CONTAINER -->
        <div id="screen-container"></div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">Command sent</div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const state = {
            registeredDevices: [], 
            detectedDevices: {},   
            currentScreen: 'dashboard',
            selectedDeviceId: null,
            mqttClient: null,
            mqttConnected: false,
            events: [],
            alarms: []
        };

        const MQTT_BROKER = "wss://test.mosquitto.org:8081/mqtt";
        const STORAGE_KEY = "MRPSP_REGISTERED_DEVICES";
        
        function initApp() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    state.registeredDevices = JSON.parse(stored);
                } catch (e) {
                    console.error("Failed to parse local storage", e);
                    state.registeredDevices = [];
                }
            }

            connectMQTT();
            renderScreen();
            addEvent("SYSTEM", "BMS Dashboard Initialized");
        }

        function saveRegistrations() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.registeredDevices));
            updateSidebarStats();
        }

        function isRegistered(deviceId) {
            return state.registeredDevices.some(d => d.device_id === deviceId);
        }

        function connectMQTT() {
            updateSystemStatus(false, "CONNECTING...");
            
            state.mqttClient = mqtt.connect(MQTT_BROKER);

            state.mqttClient.on("connect", () => {
                state.mqttConnected = true;
                updateSystemStatus(true, "SYSTEM ONLINE");
                addEvent("SYSTEM", "MQTT Connected");
                
                // UPDATED: Now subscribing to building02
                state.mqttClient.subscribe("mrpsp/building02/devices/+/data");
                state.mqttClient.subscribe("mrpsp/building02/devices/+/status");
                
                if(state.currentScreen === 'dashboard' || state.currentScreen === 'system') {
                    renderScreen(); 
                }
            });

            state.mqttClient.on("close", () => {
                if(state.mqttConnected) {
                    state.mqttConnected = false;
                    updateSystemStatus(false, "MQTT DISCONNECTED");
                    addEvent("SYSTEM", "MQTT Disconnected");
                }
            });

            state.mqttClient.on("message", (topic, payload) => {
                handleMqttMessage(topic, payload.toString());
            });
        }

        function handleMqttMessage(topic, message) {
            // Topic format: mrpsp/building02/devices/{DEVICE_NAME}/data
            const parts = topic.split("/");
            if (parts.length !== 5) return;
            
            const deviceId = parts[3];
            const type = parts[4]; 

            if (!state.detectedDevices[deviceId]) {
                state.detectedDevices[deviceId] = {
                    device_id: deviceId,
                    name: deviceId,
                    status: 'OFFLINE',
                    fault: 'NO',
                    voltage: 0.0,
                    current: 0.0,
                    power: 0.0,
                    rssi: 0,
                    ip: 'Unknown',
                    lastSeen: new Date()
                };
            }

            const device = state.detectedDevices[deviceId];
            let statusChanged = false;

            if (type === 'data') {
                try {
                    const data = JSON.parse(message);
                    device.lastSeen = new Date();
                    
                    if (data.name) device.name = data.name;
                    if (data.voltage !== undefined) device.voltage = parseFloat(data.voltage);
                    if (data.current !== undefined) device.current = parseFloat(data.current);
                    if (data.power !== undefined) device.power = parseFloat(data.power);
                    if (data.rssi !== undefined) device.rssi = parseInt(data.rssi);
                    if (data.ip) device.ip = data.ip;
                    
                    if (data.fault && data.fault !== device.fault) {
                        device.fault = data.fault;
                        if (device.fault !== 'NO') {
                            addAlarm(deviceId, device.fault, device.current);
                        }
                    }

                    if (data.status && data.status !== device.status) {
                        device.status = data.status.toUpperCase();
                        statusChanged = true;
                    }
                } catch (e) {
                    console.error("Invalid JSON from", deviceId, message);
                }
            } else if (type === 'status') {
                const newStatus = message.trim().toUpperCase();
                if (device.status !== newStatus) {
                    device.status = newStatus;
                    statusChanged = true;
                }
                device.lastSeen = new Date();
            }

            if (statusChanged) {
                addEvent(deviceId, `Controller ${device.status}`);
            }

            updateUIGraciously(deviceId);
        }

        function publishCommand(deviceId, command) {
            if (!state.mqttConnected) {
                showToast("Cannot send command: MQTT Offline");
                return;
            }
            // UPDATED: Publishing commands to building02
            const topic = `mrpsp/building02/devices/${deviceId}/command`;
            state.mqttClient.publish(topic, command);
            showToast(`Command sent: ${command}`);
            addEvent(deviceId, `Command Sent: ${command}`);
        }

        function addEvent(device, msg) {
            const time = new Date().toLocaleTimeString();
            state.events.unshift({ time, device, msg });
            if (state.events.length > 50) state.events.pop();
            
            if (state.currentScreen === 'events') {
                renderScreen(); 
            }
        }

        function addAlarm(device, fault, current) {
            const time = new Date().toLocaleTimeString();
            const existing = state.alarms.find(a => a.device === device);
            if (!existing) {
                state.alarms.unshift({ device, fault, current, time });
                addEvent(device, `ALARM: ${fault}`);
                if (state.currentScreen === 'alarms') {
                    renderScreen();
                }
            }
        }

        function updateUIGraciously(deviceId) {
            updateSidebarStats();
            const deviceData = state.detectedDevices[deviceId];
            if (!deviceData) return;

            if (state.currentScreen === 'dashboard') {
                if (isRegistered(deviceId)) {
                    const cardId = `dash-card-${deviceId}`;
                    let cardEl = document.getElementById(cardId);
                    
                    if (deviceData.status === 'ONLINE') {
                        if (cardEl) {
                            setElementText(`${cardId}-voltage`, deviceData.voltage.toFixed(1) + ' V');
                            setElementText(`${cardId}-current`, deviceData.current.toFixed(2) + ' A');
                            setElementText(`${cardId}-power`, deviceData.power.toFixed(1) + ' W');
                            setElementText(`${cardId}-rssi`, deviceData.rssi + ' dBm');
                            setElementText(`${cardId}-fault`, deviceData.fault);
                            setElementText(`${cardId}-status`, 'ONLINE');
                            updateStatusClass(`${cardId}-status-dot`, 'dot-online');
                            updateTextClass(`${cardId}-status`, 'text-online');
                        } else {
                            appendDashboardCard(deviceData);
                            checkDashboardEmptyState();
                        }
                    } else {
                        if (cardEl) {
                            cardEl.remove();
                            checkDashboardEmptyState();
                        }
                    }
                }
            }
            
            else if (state.currentScreen === 'room_detail' && state.selectedDeviceId === deviceId) {
                setElementText('rd-voltage', deviceData.voltage.toFixed(1) + ' V');
                setElementText('rd-current', deviceData.current.toFixed(2) + ' A');
                setElementText('rd-power', deviceData.power.toFixed(1) + ' W');
                setElementText('rd-rssi', deviceData.rssi + ' dBm');
                setElementText('rd-supply-status', deviceData.status === 'OFFLINE' ? 'UNKNOWN' : (deviceData.power > 0 ? 'ON' : 'OFF'));
                setElementText('rd-fault', deviceData.fault);
                
                const statusEl = document.getElementById('rd-status');
                if(statusEl) {
                    statusEl.innerText = deviceData.status;
                    statusEl.className = deviceData.status === 'ONLINE' ? 'text-online' : 'text-offline';
                }
                const dotEl = document.getElementById('rd-status-dot');
                if(dotEl) {
                    dotEl.className = `status-dot ${deviceData.status === 'ONLINE' ? 'dot-online' : 'dot-offline'}`;
                }

                const offlineMsg = document.getElementById('rd-offline-msg');
                if (deviceData.status === 'OFFLINE' && offlineMsg) {
                    offlineMsg.classList.remove('hidden');
                } else if (offlineMsg) {
                    offlineMsg.classList.add('hidden');
                }
            }

            else if (state.currentScreen === 'register') {
                const listContainer = document.getElementById('register-list-container');
                if (listContainer) {
                    listContainer.innerHTML = buildRegisterListHTML();
                }
            }
            
            else if (state.currentScreen === 'system') {
                setElementText('sys-detected', Object.keys(state.detectedDevices).length);
                setElementText('sys-online', getOnlineRegisteredCount());
            }
        }

        function setElementText(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }
        function updateStatusClass(id, className) {
            const el = document.getElementById(id);
            if (el) el.className = `status-dot ${className}`;
        }
        function updateTextClass(id, className) {
            const el = document.getElementById(id);
            if (el) el.className = className;
        }

        function updateSystemStatus(isOnline, text) {
            setElementText("system-status-text", text);
            updateStatusClass("system-status-dot", isOnline ? "dot-online" : "dot-offline");
            updateSidebarStats();
        }

        function updateSidebarStats() {
            const onlineCount = getOnlineRegisteredCount();
            setElementText("sidebar-online-count", onlineCount.toString().padStart(2, '0'));
        }

        function getOnlineRegisteredCount() {
            return state.registeredDevices.filter(reg => {
                const d = state.detectedDevices[reg.device_id];
                return d && d.status === 'ONLINE';
            }).length;
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 3000);
        }

        function navigate(screenName, params = null) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.nav-item');
            if (screenName === 'dashboard') items[0].classList.add('active');
            else if (screenName === 'register') items[1].classList.add('active');
            else if (screenName === 'registered') items[2].classList.add('active');
            else if (screenName === 'alarms') items[3].classList.add('active');
            else if (screenName === 'events') items[4].classList.add('active');
            else if (screenName === 'system') items[5].classList.add('active');

            state.currentScreen = screenName;
            
            if (screenName === 'room_detail' && params) {
                state.selectedDeviceId = params;
            } else {
                state.selectedDeviceId = null;
            }

            renderScreen();
        }

        function renderScreen() {
            const container = document.getElementById("screen-container");
            container.innerHTML = ""; 

            switch (state.currentScreen) {
                case 'dashboard': renderDashboard(container); break;
                case 'register': renderRegister(container); break;
                case 'registered': renderRegistered(container); break;
                case 'room_detail': renderRoomDetail(container); break;
                case 'alarms': renderAlarms(container); break;
                case 'events': renderEvents(container); break;
                case 'system': renderSystem(container); break;
            }
        }
        
        function renderDashboard(container) {
            container.innerHTML = `<h2 class="page-title">Monitoring Dashboard</h2>`;
            
            if (!state.mqttConnected) {
                container.innerHTML += `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔌</div>
                        <h3>SYSTEM OFFLINE</h3>
                        <p class="subtitle">Waiting for MQTT connection...</p>
                    </div>`;
                return;
            }

            const grid = document.createElement("div");
            grid.className = "grid";
            grid.id = "dashboard-grid";
            
            let onlineCount = 0;

            state.registeredDevices.forEach(reg => {
                const deviceData = state.detectedDevices[reg.device_id];
                if (deviceData && deviceData.status === 'ONLINE') {
                    grid.appendChild(createDashboardCard(deviceData));
                    onlineCount++;
                }
            });

            container.appendChild(grid);

            const emptyState = document.createElement("div");
            emptyState.id = "dash-empty-state";
            emptyState.className = "empty-state " + (onlineCount > 0 ? "hidden" : "");
            emptyState.innerHTML = `
                <div class="empty-state-icon">📡</div>
                <h3>WAITING FOR ONLINE DEVICES</h3>
                <p class="subtitle">No registered ESP controller is currently online.<br>The system will automatically display registered devices when their MQTT data is received.</p>
            `;
            container.appendChild(emptyState);
        }

        function createDashboardCard(device) {
            const div = document.createElement("div");
            div.className = "card";
            div.id = `dash-card-${device.device_id}`;
            div.innerHTML = `
                <div class="room-card-header">
                    <div class="room-name">${device.name}</div>
                    <div class="status-badge" style="border:none; padding:0; background:transparent;">
                        <div class="status-dot dot-online" id="${div.id}-status-dot"></div>
                        <span class="text-online" id="${div.id}-status">ONLINE</span>
                    </div>
                </div>
                
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="label">Voltage</div>
                        <div class="value-large" id="${div.id}-voltage">${device.voltage.toFixed(1)} V</div>
                    </div>
                    <div class="metric-box">
                        <div class="label">Current</div>
                        <div class="value-large" id="${div.id}-current">${device.current.toFixed(2)} A</div>
                    </div>
                    <div class="metric-box">
                        <div class="label">Power</div>
                        <div class="value-large" id="${div.id}-power">${device.power.toFixed(1)} W</div>
                    </div>
                    <div class="metric-box">
                        <div class="label">Fault</div>
                        <div class="value-large" id="${div.id}-fault" style="font-size: 24px;">${device.fault}</div>
                    </div>
                </div>
                
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="label">Signal: <span id="${div.id}-rssi">${device.rssi} dBm</span></div>
                    <button class="btn" onclick="navigate('room_detail', '${device.device_id}')">OPEN ROOM</button>
                </div>
            `;
            return div;
        }

        function appendDashboardCard(device) {
            const grid = document.getElementById("dashboard-grid");
            if (grid && !document.getElementById(`dash-card-${device.device_id}`)) {
                grid.appendChild(createDashboardCard(device));
            }
        }

        function checkDashboardEmptyState() {
            const emptyState = document.getElementById("dash-empty-state");
            const grid = document.getElementById("dashboard-grid");
            if (emptyState && grid) {
                if (grid.children.length === 0) {
                    emptyState.classList.remove("hidden");
                } else {
                    emptyState.classList.add("hidden");
                }
            }
        }

        function renderRegister(container) {
            container.innerHTML = `
                <h2 class="page-title">Register ESP Controller</h2>
                <div class="subtitle">Select a detected device to register it to the system.</div>
                
                <div id="register-selection" class="hidden card" style="margin-bottom: 30px; border-left: 5px solid var(--primary);">
                    <h3 style="margin-bottom: 15px; color: var(--primary);">SELECTED ESP</h3>
                    <div class="list-item" style="border:none; padding:0; background:transparent;">
                        <div>
                            <div class="label">Device ID</div>
                            <div class="value-large" style="font-size: 24px;" id="sel-device-id">-</div>
                            <div class="label" style="margin-top: 10px;">Device Name</div>
                            <div class="value-large" style="font-size: 24px;" id="sel-device-name">-</div>
                        </div>
                        <button class="btn btn-success" id="btn-register-action" onclick="executeRegistration()">[ REGISTER DEVICE ]</button>
                    </div>
                </div>

                <h3>Detected ESP Devices</h3>
                <div id="register-list-container" style="margin-top: 20px;">
                    ${buildRegisterListHTML()}
                </div>
            `;
        }

        function buildRegisterListHTML() {
            let html = "";
            const detectedIds = Object.keys(state.detectedDevices);
            let count = 0;

            detectedIds.forEach(id => {
                const device = state.detectedDevices[id];
                if (!isRegistered(id)) {
                    count++;
                    const statusClass = device.status === 'ONLINE' ? 'text-online' : 'text-offline';
                    html += `
                    <div class="list-item">
                        <div>
                            <div class="room-name" style="font-size: 24px;">ESP8266</div>
                            <div style="margin: 5px 0;"><strong>Device ID:</strong> ${device.device_id}</div>
                            <div style="margin: 5px 0;"><strong>Device Name:</strong> ${device.name}</div>
                            <div style="margin: 5px 0;"><strong>Signal:</strong> ${device.rssi} dBm</div>
                            <div style="margin: 5px 0;"><strong>Status:</strong> <span class="${statusClass}">${device.status}</span></div>
                        </div>
                        <button class="btn btn-secondary" onclick="selectForRegistration('${device.device_id}')">[ SELECT ]</button>
                    </div>`;
                }
            });

            if (count === 0) {
                html = `<div class="empty-state" style="padding: 30px;">No new unregistered devices detected.</div>`;
            }
            return html;
        }

        function selectForRegistration(deviceId) {
            const device = state.detectedDevices[deviceId];
            if (!device) return;
            
            document.getElementById("register-selection").classList.remove("hidden");
            setElementText("sel-device-id", device.device_id);
            setElementText("sel-device-name", device.name);
            
            document.getElementById("btn-register-action").dataset.regId = device.device_id;
            document.getElementById("btn-register-action").dataset.regName = device.name;
        }

        function executeRegistration() {
            const btn = document.getElementById("btn-register-action");
            const deviceId = btn.dataset.regId;
            const deviceName = btn.dataset.regName;

            if (deviceId && !isRegistered(deviceId)) {
                state.registeredDevices.push({ device_id: deviceId, name: deviceName });
                saveRegistrations();
                showToast(`Registered ${deviceName} successfully`);
                
                document.getElementById("register-selection").classList.add("hidden");
                const listContainer = document.getElementById('register-list-container');
                if (listContainer) listContainer.innerHTML = buildRegisterListHTML();
            }
        }

        function renderRegistered(container) {
            container.innerHTML = `
                <h2 class="page-title">Registered ESPs</h2>
                <div class="subtitle">Manage authorized controllers.</div>
                <div id="registered-list-container" style="margin-top: 20px;">
                    ${buildRegisteredListHTML()}
                </div>
            `;
        }

        function buildRegisteredListHTML() {
            if (state.registeredDevices.length === 0) {
                return `<div class="empty-state">No registered devices.</div>`;
            }

            let html = "";
            state.registeredDevices.forEach(reg => {
                const liveData = state.detectedDevices[reg.device_id];
                const status = liveData ? liveData.status : 'OFFLINE';
                const statusClass = status === 'ONLINE' ? 'text-online' : 'text-offline';
                const name = liveData ? liveData.name : reg.name;

                html += `
                <div class="list-item" id="reg-item-${reg.device_id}">
                    <div>
                        <div class="room-name" style="font-size: 24px;">${name}</div>
                        <div style="color: var(--text-muted);">${reg.device_id}</div>
                        <div class="${statusClass}" style="margin-top: 10px;">● ${status}</div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteESP('${reg.device_id}')">[ DELETE ]</button>
                </div>`;
            });
            return html;
        }

        function deleteESP(deviceId) {
            if (confirm("Are you sure you want to delete this ESP? It will immediately disappear from the dashboard.")) {
                state.registeredDevices = state.registeredDevices.filter(d => d.device_id !== deviceId);
                saveRegistrations();
                
                const el = document.getElementById(`reg-item-${deviceId}`);
                if (el) el.remove();
                
                showToast("ESP Deleted");
                
                const container = document.getElementById('registered-list-container');
                if (container && container.children.length === 0) {
                    container.innerHTML = `<div class="empty-state">No registered devices.</div>`;
                }
            }
        }

        function renderRoomDetail(container) {
            const deviceId = state.selectedDeviceId;
            let deviceData = state.detectedDevices[deviceId];
            
            if (!deviceData) {
                const regInfo = state.registeredDevices.find(d => d.device_id === deviceId);
                deviceData = {
                    device_id: deviceId,
                    name: regInfo ? regInfo.name : deviceId,
                    status: 'OFFLINE', voltage: 0, current: 0, power: 0, rssi: 0, fault: 'NO', ip: 'Unknown'
                };
            }

            const statusClass = deviceData.status === 'ONLINE' ? 'text-online' : 'text-offline';
            const dotClass = deviceData.status === 'ONLINE' ? 'dot-online' : 'dot-offline';

            container.innerHTML = `
                <button class="btn btn-secondary" style="margin-bottom: 20px;" onclick="navigate('dashboard')">← BACK TO DASHBOARD</button>
                
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
                        <div>
                            <h2 class="room-name" style="font-size: 36px; margin:0;">${deviceData.name}</h2>
                            <div class="subtitle" style="margin: 5px 0 0 0;">${deviceData.device_id}</div>
                        </div>
                        <div class="status-badge">
                            <div class="status-dot ${dotClass}" id="rd-status-dot"></div>
                            <span class="${statusClass}" id="rd-status">${deviceData.status}</span>
                        </div>
                    </div>

                    <div id="rd-offline-msg" class="${deviceData.status === 'ONLINE' ? 'hidden' : ''}" style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold;">
                        ⚠️ DEVICE CONNECTION LOST
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="label">VOLTAGE</div>
                            <div class="value-large" id="rd-voltage">${deviceData.voltage.toFixed(1)} V</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">CURRENT</div>
                            <div class="value-large" id="rd-current">${deviceData.current.toFixed(2)} A</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">POWER</div>
                            <div class="value-large" id="rd-power">${deviceData.power.toFixed(1)} W</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">SIGNAL</div>
                            <div class="value-large" id="rd-rssi">${deviceData.rssi} dBm</div>
                        </div>
                    </div>

                    <h3 style="margin: 30px 0 15px 0;">ELECTRICAL STATUS</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: var(--bg-color); padding: 20px; border-radius: 8px;">
                        <div><strong>Supply Status:</strong> <span id="rd-supply-status">${deviceData.status === 'OFFLINE' ? 'UNKNOWN' : (deviceData.power > 0 ? 'ON' : 'OFF')}</span></div>
                        <div><strong>Fault:</strong> <span id="rd-fault">${deviceData.fault}</span></div>
                        <div><strong>IP Address:</strong> <span>${deviceData.ip}</span></div>
                    </div>

                    <div class="control-panel">
                        <h3 style="width: 100%; margin-bottom: 10px;">REMOTE CONTROL</h3>
                        <button class="btn btn-success" onclick="publishCommand('${deviceId}', 'ON')">[ TURN SUPPLY ON ]</button>
                        <button class="btn btn-danger" onclick="publishCommand('${deviceId}', 'OFF')">[ TURN SUPPLY OFF ]</button>
                        <button class="btn btn-secondary" onclick="publishCommand('${deviceId}', 'STATUS')">[ REQUEST STATUS ]</button>
                        <button class="btn" style="background: var(--warning-color); color: black;" onclick="publishCommand('${deviceId}', 'RESET_FAULT')">[ RESET FAULT ]</button>
                    </div>
                </div>
            `;
        }

        function renderAlarms(container) {
            container.innerHTML = `
                <h2 class="page-title">Active Alarms</h2>
                <div class="subtitle">System faults and warnings requiring attention.</div>
            `;
            
            if (state.alarms.length === 0) {
                container.innerHTML += `<div class="empty-state">No active alarms.</div>`;
                return;
            }

            state.alarms.forEach(al => {
                const dev = state.detectedDevices[al.device] || { name: al.device };
                container.innerHTML += `
                <div class="list-item" style="border-left: 5px solid var(--alarm-color);">
                    <div>
                        <div class="room-name" style="color: var(--alarm-color);">🔴 ${dev.name}</div>
                        <div class="value-large" style="font-size: 22px; margin: 5px 0;">${al.fault}</div>
                        <div style="color: var(--text-muted);">Current: ${al.current} A | Time: ${al.time}</div>
                    </div>
                    <button class="btn" onclick="navigate('room_detail', '${al.device}')">[ OPEN ROOM ]</button>
                </div>`;
            });
        }

        function renderEvents(container) {
            container.innerHTML = `
                <h2 class="page-title">System Events</h2>
                <div class="subtitle">Recent MQTT activity and command history.</div>
                <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow:hidden;">
            `;
            
            let evHtml = `<table style="width:100%; border-collapse: collapse; text-align: left;">
                <tr style="background: #EBF4FF; border-bottom: 1px solid var(--border-color);">
                    <th style="padding: 15px;">Time</th>
                    <th style="padding: 15px;">Source</th>
                    <th style="padding: 15px;">Event</th>
                </tr>`;

            if (state.events.length === 0) {
                evHtml += `<tr><td colspan="3" style="padding: 20px; text-align: center; color: var(--text-muted);">No recent events</td></tr>`;
            } else {
                state.events.forEach(ev => {
                    const dev = state.detectedDevices[ev.device];
                    const sourceName = dev ? dev.name : ev.device;
                    evHtml += `
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 15px; color: var(--text-muted);">${ev.time}</td>
                        <td style="padding: 15px; font-weight: bold;">${sourceName}</td>
                        <td style="padding: 15px;">${ev.msg}</td>
                    </tr>`;
                });
            }
            
            evHtml += `</table></div>`;
            container.innerHTML += evHtml;
        }

        function renderSystem(container) {
            const detectedCount = Object.keys(state.detectedDevices).length;
            const regCount = state.registeredDevices.length;
            const onlineCount = getOnlineRegisteredCount();
            
            container.innerHTML = `
                <h2 class="page-title">System Configuration</h2>
                
                <div class="card" style="margin-bottom: 20px;">
                    <h3>Connection Details</h3>
                    <div style="display: grid; grid-template-columns: 150px 1fr; gap: 15px; margin-top: 15px;">
                        <div class="label">MQTT Broker</div>
                        <div>test.mosquitto.org</div>
                        
                        <div class="label">WebSocket</div>
                        <div>${MQTT_BROKER}</div>
                        
                        <div class="label">Connection</div>
                        <div class="${state.mqttConnected ? 'text-online' : 'text-offline'}">
                            ${state.mqttConnected ? 'ONLINE' : 'OFFLINE'}
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>System Statistics</h3>
                    <div class="metrics-grid" style="margin-top: 20px;">
                        <div class="metric-box">
                            <div class="label">Registered Devices</div>
                            <div class="value-large">${regCount}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">Online Devices</div>
                            <div class="value-large" id="sys-online">${onlineCount}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">Detected Devices</div>
                            <div class="value-large" id="sys-detected">${detectedCount}</div>
                        </div>
                        <div class="metric-box">
                            <div class="label">Browser Time</div>
                            <div class="value-large" style="font-size: 24px;" id="sys-time">${new Date().toLocaleTimeString()}</div>
                        </div>
                    </div>
                </div>
            `;

            if (window.sysClock) clearInterval(window.sysClock);
            window.sysClock = setInterval(() => {
                if (state.currentScreen === 'system') {
                    setElementText('sys-time', new Date().toLocaleTimeString());
                } else {
                    clearInterval(window.sysClock);
                }
            }, 1000);
        }

        window.onload = initApp;

    </script>
</body>
</html>
