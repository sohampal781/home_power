<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRPSP | Enterprise Secure BMS</title>
    
    <!-- External Libraries for Premium UI -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           PREMIUM DESIGN SYSTEM (VARIABLES)
           ========================================================== */
        :root {
            /* Colors */
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #f8fafc;
            --text-sidebar-dim: #94a3b8;

            --border-light: #e2e8f0;
            --border-dark: #334155;

            /* Brand & Status Colors */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #0ea5e9;

            /* Shadows & Metrics */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* ==========================================================
           SIDEBAR
           ========================================================== */
        #sidebar { 
            width: var(--sidebar-width); background: var(--sidebar-bg); 
            display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100;
            color: var(--text-sidebar-dim); transition: all 0.3s ease;
        }
        .brand { 
            padding: 30px 25px; border-bottom: 1px solid var(--border-dark); 
            display: flex; align-items: center; gap: 12px; 
        }
        .brand i { font-size: 32px; color: var(--primary); }
        .brand h2 { font-size: 20px; color: var(--text-light); font-weight: 700; line-height: 1.2; letter-spacing: 0.5px; }

        .nav-menu { padding: 20px 0; flex-grow: 1; list-style: none; }
        .nav-item { 
            padding: 16px 25px; margin: 4px 12px; border-radius: 8px;
            font-size: 15px; font-weight: 500; cursor: pointer; 
            display: flex; align-items: center; gap: 14px; 
            transition: all 0.2s ease;
        }
        .nav-item i { font-size: 22px; }
        .nav-item:hover { background: var(--sidebar-hover); color: var(--text-light); }
        .nav-item.active { background: var(--primary); color: var(--text-light); box-shadow: var(--shadow-md); }

        .sidebar-footer { padding: 25px; border-top: 1px solid var(--border-dark); background: rgba(0,0,0,0.1); }
        .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-light); }

        /* ==========================================================
           MAIN CONTENT
           ========================================================== */
        #main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 40px 50px; width: calc(100% - var(--sidebar-width)); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header-title { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; letter-spacing: -0.5px; }
        .subtitle { font-size: 15px; color: var(--text-muted); }
        
        .sys-status { 
            display: flex; align-items: center; gap: 10px; padding: 10px 20px; 
            background: var(--surface); border-radius: 30px; box-shadow: var(--shadow-sm);
            font-weight: 600; font-size: 14px; color: var(--text-main); border: 1px solid var(--border-light);
        }
        .pulse-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-online { background: var(--success); box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse-green 2s infinite; }
        .dot-offline { background: var(--danger); box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); animation: pulse-red 2s infinite; }
        
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); } 70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

        /* ==========================================================
           CARDS & GRIDS
           ========================================================== */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
        .card { 
            background: var(--surface); border-radius: var(--radius-lg); padding: 24px; 
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .room-name { font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .hw-id { font-size: 13px; color: var(--text-muted); font-family: monospace; background: var(--bg-body); padding: 4px 8px; border-radius: 4px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .metric-box { background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); display: flex; flex-direction: column; }
        .metric-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .metric-val { font-size: 26px; font-weight: 700; color: var(--text-main); }
        .metric-val span { font-size: 16px; font-weight: 500; color: var(--text-muted); }

        /* ==========================================================
           LISTS & BUTTONS
           ========================================================== */
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 24px; background: var(--surface); border-radius: var(--radius-md); 
            margin-bottom: 12px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
        }
        .list-info h3 { font-size: 18px; margin-bottom: 6px; color: var(--text-main); }
        .list-info p { font-size: 13px; color: var(--text-muted); font-family: monospace; }

        .btn { 
            padding: 12px 24px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; 
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            transition: all 0.2s ease;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: rgba(239,68,68,0.1); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-body); }

        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--danger) !important; }

        .toast { 
            position: fixed; bottom: 30px; right: 30px; background: var(--sidebar-bg); color: white; 
            padding: 16px 24px; border-radius: 12px; font-weight: 500; box-shadow: var(--shadow-lg); 
            display: flex; align-items: center; gap: 12px; transform: translateY(100px); opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        .hidden { display: none !important; }
        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-icon { font-size: 64px; color: var(--border-light); margin-bottom: 20px; }
        .empty-state h3 { font-size: 20px; color: var(--text-main); margin-bottom: 8px; }
        .empty-state p { color: var(--text-muted); }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="brand">
            <i class="ph-fill ph-cpu"></i>
            <h2>SECURE<br>BMS</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="navigate('dashboard')"><i class="ph ph-squares-four"></i> Dashboard</li>
            <li class="nav-item" onclick="navigate('register')"><i class="ph ph-radar"></i> Detect Controllers</li>
            <li class="nav-item" onclick="navigate('registered')"><i class="ph ph-shield-check"></i> Authorized Blocks</li>
            <li class="nav-item" onclick="navigate('system')"><i class="ph ph-sliders"></i> System Config</li>
        </ul>
        <div class="sidebar-footer">
            <div class="stat-label">Online Controllers</div>
            <div class="stat-value" id="sidebar-online-count">0</div>
        </div>
    </aside>

    <main id="main-content">
        <div class="top-bar">
            <div>
                <h1 class="header-title">Enterprise Dashboard</h1>
                <div class="subtitle">Cloud-Synced Secure Electrical Management</div>
            </div>
            <div class="sys-status">
                <div class="pulse-dot dot-offline" id="system-status-dot"></div>
                <span id="system-status-text">DISCONNECTED</span>
            </div>
        </div>
        <div id="screen-container"></div>
    </main>

    <div id="toast" class="toast">
        <i class="ph-fill ph-check-circle" style="color: var(--success); font-size: 24px;"></i>
        <span id="toast-msg">Action completed</span>
    </div>

    <script>
        // STRICT AUTHENTICATION TOKEN
        const EXPECTED_TOKEN = "MRPSP_AUTH_999";
        const MQTT_BROKER = "wss://test.mosquitto.org:8081/mqtt";
        const STORAGE_KEY = "SECURE_BMS_DEVICES";
        
        // UNIQUE FEATURE: Cloud Save Topic (Makes data persist across devices!)
        const CONFIG_TOPIC = "mrpsp/secure_bms/system/cloud_config";

        const state = {
            registeredDevices: [], 
            detectedDevices: {},   
            currentScreen: 'dashboard',
            selectedDeviceId: null,
            mqttClient: null,
            mqttConnected: false
        };

        function initApp() {
            // 1. Load from local fallback initially
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) state.registeredDevices = JSON.parse(stored);
            
            connectMQTT();
            renderScreen();
        }

        // Saves locally AND to the MQTT Cloud (Retained)
        function saveRegistrations() {
            const configJson = JSON.stringify(state.registeredDevices);
            localStorage.setItem(STORAGE_KEY, configJson);
            
            if (state.mqttConnected) {
                // Publish with { retain: true }. This means ANY new device opening the website
                // will instantly receive this file from the cloud!
                state.mqttClient.publish(CONFIG_TOPIC, configJson, { retain: true });
            }
            updateSidebarStats();
        }

        function connectMQTT() {
            setSystemStatus(false, "CONNECTING...");
            state.mqttClient = mqtt.connect(MQTT_BROKER);

            state.mqttClient.on("connect", () => {
                state.mqttConnected = true;
                setSystemStatus(true, "CLOUD CONNECTED");
                
                // Subscribe to device data
                state.mqttClient.subscribe("mrpsp/secure_bms/+/data");
                state.mqttClient.subscribe("mrpsp/secure_bms/+/status");
                
                // Subscribe to the Cloud Config (to sync across devices)
                state.mqttClient.subscribe(CONFIG_TOPIC);
            });

            state.mqttClient.on("close", () => {
                state.mqttConnected = false;
                setSystemStatus(false, "DISCONNECTED");
            });

            state.mqttClient.on("message", (topic, payload) => handleMqttMessage(topic, payload.toString()));
        }

        function handleMqttMessage(topic, message) {
            // CLOUD SYNC FEATURE: Receive registered devices from cloud
            if (topic === CONFIG_TOPIC) {
                try {
                    const cloudConfig = JSON.parse(message);
                    state.registeredDevices = cloudConfig;
                    localStorage.setItem(STORAGE_KEY, message); // Update local cache
                    updateSidebarStats();
                    if (state.currentScreen === 'dashboard' || state.currentScreen === 'registered') {
                        renderScreen();
                    }
                } catch(e) {}
                return;
            }

            const parts = topic.split("/");
            if (parts.length !== 4) return;
            
            const deviceId = parts[2]; 
            const type = parts[3];     

            if (!state.detectedDevices[deviceId]) {
                state.detectedDevices[deviceId] = {
                    device_id: deviceId, block_name: "Unknown Block",
                    status: 'OFFLINE', supply: 'OFF', fault: 'NO',
                    voltage: 0, current: 0, power: 0, rssi: 0
                };
            }

            const device = state.detectedDevices[deviceId];

            if (type === 'data') {
                try {
                    const data = JSON.parse(message);
                    
                    // SECURITY CHECK
                    if (data.token !== EXPECTED_TOKEN) return; 

                    device.status = 'ONLINE'; 
                    if (data.block_name) device.block_name = data.block_name;
                    if (data.supply) device.supply = data.supply;
                    if (data.voltage !== undefined) device.voltage = data.voltage;
                    if (data.current !== undefined) device.current = data.current;
                    if (data.power !== undefined) device.power = data.power;
                    if (data.rssi !== undefined) device.rssi = data.rssi;
                    
                } catch (e) { return; }
            } else if (type === 'status') {
                device.status = message.trim().toUpperCase();
            }

            updateUI(deviceId);
        }

       function publishCommand(deviceId, command) {
    if(!state.mqttConnected) { 
        showToast("Error: Cloud Disconnected"); 
        return; 
    }

    // 1. INSTANT OPTIMISTIC UI: Update the screen before the ESP even answers
    const dev = state.detectedDevices[deviceId];
    if (dev) {
        if (command === "ON") {
            dev.supply = "ON";
            dev.voltage = 230.0;
            dev.current = 1.5;
            dev.power = 345.0;
        } else if (command === "OFF") {
            dev.supply = "OFF";
            dev.voltage = 0.0;
            dev.current = 0.0;
            dev.power = 0.0;
        }
        updateUI(deviceId); // Re-renders the card instantly with zero delay
    }

    // 2. Send the command over MQTT
    const topic = `mrpsp/secure_bms/${deviceId}/command`;
    state.mqttClient.publish(topic, command);
    showToast(`Command ${command} executed`);
}

        // Smart DOM Updater (No Flickering)
        function updateUI(deviceId) {
            updateSidebarStats();
            const dev = state.detectedDevices[deviceId];
            if (!dev) return;

            if (state.currentScreen === 'dashboard' && isRegistered(deviceId)) {
                let card = document.getElementById(`card-${deviceId}`);
                if (dev.status === 'ONLINE') {
                    if (card) {
                        document.getElementById(`v-${deviceId}`).innerHTML = `${dev.voltage.toFixed(1)} <span>V</span>`;
                        document.getElementById(`c-${deviceId}`).innerHTML = `${dev.current.toFixed(2)} <span>A</span>`;
                        document.getElementById(`p-${deviceId}`).innerHTML = `${dev.power.toFixed(1)} <span>W</span>`;
                        
                        const supplyEl = document.getElementById(`s-${deviceId}`);
                        supplyEl.innerText = dev.supply;
                        supplyEl.className = `metric-val ${dev.supply === 'ON' ? 'text-success' : 'text-danger'}`;
                    } else {
                        renderScreen();
                    }
                } else if (card) {
                    card.remove(); 
                }
                checkDashboardEmpty();
            }
            else if (state.currentScreen === 'room_detail' && state.selectedDeviceId === deviceId) {
                document.getElementById('rd-v').innerHTML = `${dev.voltage.toFixed(1)} <span>V</span>`;
                document.getElementById('rd-c').innerHTML = `${dev.current.toFixed(2)} <span>A</span>`;
                document.getElementById('rd-p').innerHTML = `${dev.power.toFixed(1)} <span>W</span>`;
                
                const s = document.getElementById('rd-supply');
                s.innerText = dev.supply;
                s.className = `metric-val ${dev.supply === 'ON' ? 'text-success' : 'text-danger'}`;
                
                document.getElementById('rd-offline').className = dev.status === 'ONLINE' ? 'hidden' : '';
            }
            else if (state.currentScreen === 'register') {
                const list = document.getElementById('reg-list');
                if (list) list.innerHTML = buildRegisterList();
            }
        }

        // --- NAVIGATION & RENDERING ---
        function navigate(screen, params = null) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            state.currentScreen = screen;
            state.selectedDeviceId = params;
            renderScreen();
        }

        function renderScreen() {
            const container = document.getElementById("screen-container");
            container.innerHTML = "";
            if (state.currentScreen === 'dashboard') renderDashboard(container);
            if (state.currentScreen === 'register') renderRegister(container);
            if (state.currentScreen === 'registered') renderRegistered(container);
            if (state.currentScreen === 'room_detail') renderRoomDetail(container);
            if (state.currentScreen === 'system') renderSystem(container);
        }

        function renderDashboard(container) {
            let html = `<div id="grid" class="grid"></div>`;
            container.innerHTML = html;
            
            let grid = document.getElementById('grid');
            let count = 0;
            state.registeredDevices.forEach(reg => {
                const dev = state.detectedDevices[reg.device_id];
                if (dev && dev.status === 'ONLINE') {
                    grid.innerHTML += createCard(dev);
                    count++;
                }
            });
            
            container.innerHTML += `
                <div id="empty-dash" class="empty-state ${count > 0 ? 'hidden' : ''}">
                    <i class="ph ph-plugs empty-icon"></i>
                    <h3>No Active Controllers</h3>
                    <p>Make sure your authorized ESP blocks are powered on and connected to WiFi.</p>
                </div>
            `;
        }

        function createCard(dev) {
            return `
            <div class="card" id="card-${dev.device_id}">
                <div class="card-header">
                    <div>
                        <div class="room-name">${dev.block_name}</div>
                        <div class="hw-id">${dev.device_id}</div>
                    </div>
                    <div class="sys-status" style="padding: 6px 12px; border:none; background: rgba(16,185,129,0.1); color: var(--success);">
                        <div class="pulse-dot dot-online"></div> ONLINE
                    </div>
                </div>
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-label"><i class="ph-fill ph-lightning"></i> Supply</div>
                        <div class="metric-val ${dev.supply === 'ON' ? 'text-success' : 'text-danger'}" id="s-${dev.device_id}">${dev.supply}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label"><i class="ph-fill ph-gauge"></i> Power</div>
                        <div class="metric-val" id="p-${dev.device_id}">${dev.power.toFixed(1)} <span>W</span></div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label"><i class="ph-fill ph-wave-sine"></i> Voltage</div>
                        <div class="metric-val" id="v-${dev.device_id}">${dev.voltage.toFixed(1)} <span>V</span></div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label"><i class="ph-fill ph-arrow-fat-line-right"></i> Current</div>
                        <div class="metric-val" id="c-${dev.device_id}">${dev.current.toFixed(2)} <span>A</span></div>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%" onclick="navigate('room_detail', '${dev.device_id}')">
                    <i class="ph-bold ph-sliders"></i> Manage Block Controller
                </button>
            </div>`;
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div style="margin-bottom: 24px;">
                    <h2 class="header-title" style="font-size:22px;">Detect New Hardware</h2>
                    <p class="subtitle">Scanning for secure tokens on the local network...</p>
                </div>
                <div id="reg-list">${buildRegisterList()}</div>
            `;
        }

        function buildRegisterList() {
            let html = "";
            let count = 0;
            Object.keys(state.detectedDevices).forEach(id => {
                if (!isRegistered(id)) {
                    count++;
                    const dev = state.detectedDevices[id];
                    html += `
                    <div class="list-item">
                        <div class="list-info">
                            <h3>${dev.block_name}</h3>
                            <p>${dev.device_id} &bull; Signal: ${dev.rssi}dBm</p>
                        </div>
                        <button class="btn btn-success" onclick="regESP('${dev.device_id}', '${dev.block_name}')">
                            <i class="ph-bold ph-plus"></i> Authorize
                        </button>
                    </div>`;
                }
            });
            return count > 0 ? html : `
                <div class="empty-state">
                    <i class="ph ph-radar empty-icon" style="animation: pulse-green 2s infinite; border-radius:50%;"></i>
                    <h3>Listening for devices...</h3>
                    <p>No new unauthorized hardware detected.</p>
                </div>`;
        }

        function regESP(id, name) {
            state.registeredDevices.push({ device_id: id, block_name: name });
            saveRegistrations(); // Saves locally AND to cloud!
            showToast(`${name} added to cloud config`);
            renderScreen();
        }

        function renderRegistered(container) {
            container.innerHTML = `
                <div style="margin-bottom: 24px;">
                    <h2 class="header-title" style="font-size:22px;">Authorized Hardware</h2>
                    <p class="subtitle">These devices are synced across all your dashboards.</p>
                </div>
                <div id="auth-list"></div>
            `;
            const list = document.getElementById('auth-list');
            
            if (state.registeredDevices.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="ph ph-shield-warning empty-icon"></i><h3>No hardware authorized</h3></div>`;
            }
            
            state.registeredDevices.forEach(reg => {
                list.innerHTML += `
                <div class="list-item">
                    <div class="list-info">
                        <h3>${reg.block_name}</h3>
                        <p>${reg.device_id}</p>
                    </div>
                    <button class="btn btn-danger" onclick="delESP('${reg.device_id}')">
                        <i class="ph-bold ph-trash"></i> Revoke
                    </button>
                </div>`;
            });
        }

        function delESP(id) {
            state.registeredDevices = state.registeredDevices.filter(d => d.device_id !== id);
            saveRegistrations(); // Updates cloud instantly!
            showToast("Access revoked from cloud");
            renderScreen();
        }

        function renderRoomDetail(container) {
            const dev = state.detectedDevices[state.selectedDeviceId];
            if (!dev) return;
            
            container.innerHTML = `
                <button class="btn btn-outline" style="margin-bottom: 24px;" onclick="navigate('dashboard')">
                    <i class="ph-bold ph-arrow-left"></i> Back to Dashboard
                </button>
                
                <div class="card" style="max-width: 800px;">
                    <div class="card-header" style="align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom:20px;">
                        <div>
                            <h2 class="room-name" style="font-size:32px;">${dev.block_name}</h2>
                            <div class="hw-id">${dev.device_id}</div>
                        </div>
                        <div class="sys-status" style="background: ${dev.status==='ONLINE'?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)'}; border:none;">
                            <div class="pulse-dot ${dev.status==='ONLINE'?'dot-online':'dot-offline'}"></div> 
                            <span class="${dev.status==='ONLINE'?'text-success':'text-danger'}">${dev.status}</span>
                        </div>
                    </div>
                    
                    <div id="rd-offline" class="${dev.status === 'ONLINE' ? 'hidden' : ''}" style="background: rgba(239,68,68,0.1); color: var(--danger); padding: 16px; border-radius: 8px; margin: 20px 0; font-weight: 600; display:flex; align-items:center; gap:10px;">
                        <i class="ph-bold ph-warning-circle" style="font-size:24px;"></i> DEVICE DISCONNECTED
                    </div>

                    <div class="metrics-grid" style="grid-template-columns: repeat(4, 1fr); margin-top:24px;">
                        <div class="metric-box">
                            <div class="metric-label"><i class="ph-fill ph-lightning"></i> Supply</div>
                            <div class="metric-val ${dev.supply === 'ON' ? 'text-success' : 'text-danger'}" id="rd-supply">${dev.supply}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label"><i class="ph-fill ph-gauge"></i> Power</div>
                            <div class="metric-val" id="rd-p">${dev.power.toFixed(1)} <span>W</span></div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label"><i class="ph-fill ph-wave-sine"></i> Voltage</div>
                            <div class="metric-val" id="rd-v">${dev.voltage.toFixed(1)} <span>V</span></div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label"><i class="ph-fill ph-arrow-fat-line-right"></i> Current</div>
                            <div class="metric-val" id="rd-c">${dev.current.toFixed(2)} <span>A</span></div>
                        </div>
                    </div>

                    <div style="display:flex; gap:16px; margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--border-light);">
                        <button class="btn btn-success" style="flex:1; padding: 16px;" onclick="publishCommand('${dev.device_id}', 'ON')">
                            <i class="ph-bold ph-power"></i> TURN SUPPLY ON
                        </button>
                        <button class="btn btn-danger" style="flex:1; padding: 16px;" onclick="publishCommand('${dev.device_id}', 'OFF')">
                            <i class="ph-bold ph-power"></i> TURN SUPPLY OFF
                        </button>
                    </div>
                </div>
            `;
        }

        function renderSystem(container) {
            container.innerHTML = `
                <h2 class="header-title" style="font-size:22px; margin-bottom: 24px;">System Configuration</h2>
                <div class="grid">
                    <div class="card">
                        <h3 style="margin-bottom: 16px; display:flex; align-items:center; gap:8px;"><i class="ph-fill ph-cloud-check" color="var(--primary)"></i> Cloud Sync Status</h3>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">Your authorized devices are securely saved to the MQTT broker. You can access this dashboard from any device and your settings will automatically load.</p>
                        <div class="metric-box">
                            <div class="metric-label">Synced Devices</div>
                            <div class="metric-val">${state.registeredDevices.length}</div>
                        </div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom: 16px; display:flex; align-items:center; gap:8px;"><i class="ph-fill ph-lock-key" color="var(--success)"></i> Security Firewall</h3>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">Strict token matching is enforced. Any ESP device broadcasting without the secret token is instantly blocked and ignored.</p>
                        <div class="sys-status" style="justify-content:center; background: rgba(16,185,129,0.1); color: var(--success); border:none;">
                            FIREWALL ACTIVE
                        </div>
                    </div>
                </div>
            `;
        }
        // Inside handleMqttMessage: Record timestamp on every incoming packet
function handleMqttMessage(topic, message) {
    if (topic === CONFIG_TOPIC) {
        try {
            const cloudConfig = JSON.parse(message);
            state.registeredDevices = cloudConfig;
            localStorage.setItem(STORAGE_KEY, message);
            updateSidebarStats();
            if (state.currentScreen === 'dashboard' || state.currentScreen === 'registered') {
                renderScreen();
            }
        } catch(e) {}
        return;
    }

    const parts = topic.split("/");
    if (parts.length !== 4) return;
    
    const deviceId = parts[2]; 
    const type = parts[3];     

    if (!state.detectedDevices[deviceId]) {
        state.detectedDevices[deviceId] = {
            device_id: deviceId, block_name: "Unknown Block",
            status: 'OFFLINE', supply: 'OFF', fault: 'NO',
            voltage: 0, current: 0, power: 0, rssi: 0,
            lastSeen: 0
        };
    }

    const device = state.detectedDevices[deviceId];

    if (type === 'data') {
        try {
            const data = JSON.parse(message);
            if (data.token !== EXPECTED_TOKEN) return; 

            // Update last seen timestamp & mark ONLINE
            device.lastSeen = Date.now();
            device.status = 'ONLINE'; 

            if (data.block_name) device.block_name = data.block_name;
            if (data.supply) device.supply = data.supply;
            if (data.voltage !== undefined) device.voltage = data.voltage;
            if (data.current !== undefined) device.current = data.current;
            if (data.power !== undefined) device.power = data.power;
            if (data.rssi !== undefined) device.rssi = data.rssi;
            
        } catch (e) { return; }
    } else if (type === 'status') {
        const newStatus = message.trim().toUpperCase();
        device.status = newStatus;
        if (newStatus === 'ONLINE') {
            device.lastSeen = Date.now();
        } else {
            device.lastSeen = 0; // Force immediate offline
        }
    }

    updateUI(deviceId);
}

// ============================================================
// WATCHDOG TIMER: CHECKS EVERY 1 SECOND FOR DISCONNECTED DEVICES
// ============================================================
const OFFLINE_TIMEOUT_MS = 2500; // 2.5 seconds timeout (telemetry arrives every 500ms)

setInterval(() => {
    const now = Date.now();
    let stateChanged = false;

    Object.keys(state.detectedDevices).forEach(id => {
        const dev = state.detectedDevices[id];
        
        // If device was online but hasn't sent data in 2.5 seconds
        if (dev.status === 'ONLINE' && (now - dev.lastSeen > OFFLINE_TIMEOUT_MS)) {
            dev.status = 'OFFLINE';
            dev.voltage = 0.0;
            dev.current = 0.0;
            dev.power = 0.0;
            stateChanged = true;
            updateUI(id);
        }
    });

    if (stateChanged) {
        updateSidebarStats();
        checkDashboardEmpty();
    }
}, 1000);

        // --- UTILS ---
        function setSystemStatus(isOnline, text) {
            document.getElementById("system-status-text").innerText = text;
            document.getElementById("system-status-dot").className = `pulse-dot ${isOnline ? "dot-online" : "dot-offline"}`;
        }
        function updateSidebarStats() {
            const count = state.registeredDevices.filter(r => state.detectedDevices[r.device_id]?.status === 'ONLINE').length;
            document.getElementById("sidebar-online-count").innerText = count;
        }
        function isRegistered(id) { return state.registeredDevices.some(d => d.device_id === id); }
        function checkDashboardEmpty() {
            const e = document.getElementById('empty-dash');
            const g = document.getElementById('grid');
            if (e && g) e.className = g.children.length === 0 ? "empty-state" : "hidden";
        }
        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toast-msg").innerText = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3500);
        }

        window.onload = initApp;
    </script>
</body>
