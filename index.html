<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MRPSP Electrical SCADA
</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #071016;

    color: #d9e2e8;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    height: 75px;

    background: #0d171e;

    border-bottom:
        2px solid #1d303c;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;
}


.logo {

    font-size: 25px;

    font-weight: bold;

    letter-spacing: 1px;
}


.subtitle {

    color: #78909c;

    font-size: 12px;

    margin-top: 4px;
}


.connection {

    padding:
        10px 18px;

    border-radius: 5px;

    background: #351515;

    color: #ff5252;

    font-weight: bold;

    border:
        1px solid #713030;
}


.connection.online {

    background: #10351f;

    color: #00e676;

    border-color:
        #18753d;
}


/* =====================================================
   MAIN
   ===================================================== */

.main {

    padding: 20px;
}


/* =====================================================
   TOP INFO
   ===================================================== */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}


.info {

    background: #0d181f;

    border:
        1px solid #1d303c;

    padding: 15px;

    border-radius: 5px;
}


.info-label {

    color: #718792;

    font-size: 11px;

    text-transform: uppercase;
}


.info-value {

    font-size: 18px;

    margin-top: 7px;

    font-weight: bold;
}


/* =====================================================
   ROOM GRID
   ===================================================== */

.room-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;
}


/* =====================================================
   ROOM CARD
   ===================================================== */

.room {

    background: #0d181f;

    border:
        1px solid #1d303c;

    border-radius: 6px;

    overflow: hidden;
}


.room-header {

    padding: 12px 15px;

    background: #111f27;

    border-bottom:
        1px solid #1d303c;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.room-name {

    font-size: 17px;

    font-weight: bold;
}


.supply {

    font-size: 12px;

    font-weight: bold;

    padding:
        5px 10px;

    border-radius: 4px;

    background: #351515;

    color: #ff5252;
}


.supply.on {

    background: #10351f;

    color: #00e676;
}


/* =====================================================
   ELECTRICAL SYMBOL
   ===================================================== */

.diagram {

    height: 100px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


.line {

    position: absolute;

    height: 3px;

    width: 80%;

    background: #596b75;
}


.line.on {

    background: #00e676;

    box-shadow:
        0 0 8px #00e676;
}


.breaker {

    z-index: 2;

    width: 55px;

    height: 55px;

    border:
        3px solid #687982;

    background: #0a1217;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;
}


.breaker.on {

    border-color: #00e676;

    color: #00e676;
}


/* =====================================================
   VALUES
   ===================================================== */

.values {

    padding: 15px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}


.value {

    background: #111f27;

    padding: 10px;

    text-align: center;

    border-radius: 4px;
}


.value-label {

    font-size: 10px;

    color: #718792;
}


.value-number {

    font-size: 16px;

    font-weight: bold;

    margin-top: 5px;
}


/* =====================================================
   CONTROL
   ===================================================== */

.controls {

    display: flex;

    gap: 8px;

    padding: 0 15px 15px;
}


button {

    flex: 1;

    padding: 10px;

    border: 0;

    border-radius: 4px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.on-button {

    background: #087f3b;
}


.off-button {

    background: #a52222;
}


button:hover {

    opacity: .8;
}


/* =====================================================
   ALARM
   ===================================================== */

.alarm {

    margin-top: 20px;

    background: #0d181f;

    border:
        1px solid #1d303c;

    padding: 15px;
}


.alarm-title {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 10px;
}


.alarm-row {

    padding: 8px;

    border-bottom:
        1px solid #1d303c;

    font-size: 13px;

    color: #ff7373;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:900px) {

    .room-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media(max-width:600px) {

    .info-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .room-grid {

        grid-template-columns:
            1fr;
    }


    .header {

        height: auto;

        padding: 15px;

        display: block;
    }


    .connection {

        display: inline-block;

        margin-top: 10px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

<div>

<div class="logo">
MRPSP ELECTRICAL SCADA
</div>

<div class="subtitle">
REMOTE BUILDING POWER MONITORING SYSTEM
</div>

</div>


<div
id="connection"
class="connection">

● MQTT OFFLINE

</div>

</div>


<div class="main">


<!-- =====================================================
     SYSTEM INFORMATION
     ===================================================== -->

<div class="info-grid">


<div class="info">

<div class="info-label">
SYSTEM
</div>

<div
class="info-value">

BUILDING 01

</div>

</div>


<div class="info">

<div class="info-label">
DEVICE
</div>

<div
class="info-value">

BUILDING_SCADA_01

</div>

</div>


<div class="info">

<div class="info-label">
ESP STATUS
</div>

<div
id="espStatus"
class="info-value">

OFFLINE

</div>

</div>


<div class="info">

<div class="info-label">
WIFI RSSI
</div>

<div
id="rssi"
class="info-value">

--

</div>

</div>


</div>


<!-- =====================================================
     ROOM GRID
     ===================================================== -->

<div
id="roomGrid"
class="room-grid">

</div>


<!-- =====================================================
     ALARM PANEL
     ===================================================== -->

<div class="alarm">

<div class="alarm-title">
ALARM / EVENT LOG
</div>

<div
id="alarms">

<div class="alarm-row">
System waiting for data...
</div>

</div>

</div>


</div>


<script>


// =====================================================
// MQTT
// =====================================================

const MQTT_URL =
    "wss://test.mosquitto.org:8081/mqtt";


const DATA_TOPIC =
    "mrpsp/building01/data";


const COMMAND_TOPIC =
    "mrpsp/building01/command";


const clientId =
    "SCADA_" +
    Math.random()
    .toString(16)
    .substring(2);


const client =
    mqtt.connect(
        MQTT_URL,
        {
            clientId:
                clientId,

            clean:
                true,

            reconnectPeriod:
                3000
        }
    );


// =====================================================
// CREATE ROOMS
// =====================================================

function createRooms()
{

    const grid =
        document.getElementById(
            "roomGrid"
        );


    for (
        let i = 1;
        i <= 8;
        i++
    )
    {

        grid.innerHTML += `

        <div
        class="room"
        id="room${i}">

        <div class="room-header">

            <div class="room-name">
                ROOM ${i}
            </div>

            <div
            id="supply${i}"
            class="supply">

                OFF

            </div>

        </div>


        <div class="diagram">

            <div
            id="line${i}"
            class="line">
            </div>

            <div
            id="breaker${i}"
            class="breaker">

                ⚡

            </div>

        </div>


        <div class="values">


            <div class="value">

                <div class="value-label">
                    VOLTAGE
                </div>

                <div
                id="voltage${i}"
                class="value-number">

                    0 V

                </div>

            </div>


            <div class="value">

                <div class="value-label">
                    CURRENT
                </div>

                <div
                id="current${i}"
                class="value-number">

                    0 A

                </div>

            </div>


            <div class="value">

                <div class="value-label">
                    POWER
                </div>

                <div
                id="power${i}"
                class="value-number">

                    0 W

                </div>

            </div>


        </div>


        <div class="controls">

            <button
            class="on-button"
            onclick="roomOn(${i})">

                ON

            </button>


            <button
            class="off-button"
            onclick="roomOff(${i})">

                OFF

            </button>

        </div>


        </div>

        `;
    }
}


createRooms();


// =====================================================
// MQTT CONNECT
// =====================================================

client.on(
    "connect",
    function()
    {

        console.log(
            "MQTT CONNECTED"
        );


        document.getElementById(
            "connection"
        ).innerText =
            "● MQTT ONLINE";


        document.getElementById(
            "connection"
        ).className =
            "connection online";


        client.subscribe(
            DATA_TOPIC
        );

    }
);


// =====================================================
// MQTT OFFLINE
// =====================================================

client.on(
    "close",
    function()
    {

        document.getElementById(
            "connection"
        ).innerText =
            "● MQTT OFFLINE";


        document.getElementById(
            "connection"
        ).className =
            "connection";

    }
);


// =====================================================
// MQTT MESSAGE
// =====================================================

client.on(
    "message",
    function(topic, message)
    {

        if (
            topic !== DATA_TOPIC
        )
        {
            return;
        }


        try
        {

            const data =
                JSON.parse(
                    message.toString()
                );


            updateDashboard(
                data
            );

        }

        catch(error)
        {

            console.log(
                error
            );

        }

    }
);


// =====================================================
// UPDATE DASHBOARD
// =====================================================

function updateDashboard(
    data
)
{

    document.getElementById(
        "espStatus"
    ).innerText =
        "ONLINE";


    document.getElementById(
        "rssi"
    ).innerText =
        data.rssi +
        " dBm";


    for (
        let room of data.rooms
    )
    {

        const n =
            room.room;


        const supply =
            document.getElementById(
                "supply" + n
            );


        const line =
            document.getElementById(
                "line" + n
            );


        const breaker =
            document.getElementById(
                "breaker" + n
            );


        const isOn =
            room.supply === "ON";


        supply.innerText =
            room.supply;


        if (
            isOn
        )
        {

            supply.className =
                "supply on";


            line.className =
                "line on";


            breaker.className =
                "breaker on";

        }

        else
        {

            supply.className =
                "supply";


            line.className =
                "line";


            breaker.className =
                "breaker";

        }


        document.getElementById(
            "voltage" + n
        ).innerText =
            Number(
                room.voltage
            ).toFixed(1)
            + " V";


        document.getElementById(
            "current" + n
        ).innerText =
            Number(
                room.current
            ).toFixed(2)
            + " A";


        document.getElementById(
            "power" + n
        ).innerText =
            Number(
                room.power
            ).toFixed(1)
            + " W";


        // ------------------------------------------------
        // ALARM
        // ------------------------------------------------

        if (
            !isOn
        )
        {

            addAlarm(
                "ROOM " +
                n +
                " MAIN SUPPLY OFF"
            );

        }

    }

}


// =====================================================
// SEND ROOM ON
// =====================================================

function roomOn(
    room
)
{

    if (
        !client.connected
    )
    {

        alert(
            "MQTT is offline"
        );

        return;
    }


    const command =
        "ROOM" +
        room +
        "_ON";


    client.publish(
        COMMAND_TOPIC,
        command
    );

}


// =====================================================
// SEND ROOM OFF
// =====================================================

function roomOff(
    room
)
{

    if (
        !client.connected
    )
    {

        alert(
            "MQTT is offline"
        );

        return;
    }


    const command =
        "ROOM" +
        room +
        "_OFF";


    client.publish(
        COMMAND_TOPIC,
        command
    );

}


// =====================================================
// ALARM LOG
// =====================================================

function addAlarm(
    message
)
{

    const alarms =
        document.getElementById(
            "alarms"
        );


    const time =
        new Date()
        .toLocaleTimeString();


    alarms.innerHTML =

        `<div class="alarm-row">
            ${time}
            &nbsp;&nbsp;
            ${message}
        </div>`
        +
        alarms.innerHTML;


    // Keep only last 8 alarms

    while (
        alarms.children.length > 8
    )
    {

        alarms.removeChild(
            alarms.lastChild
        );

    }

}

</script>


</body>

</html>
