<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SCADA OCC</title>


<!-- =====================================================
     FIREBASE ONLY
     NO MQTT
     ===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #0d1117;

    color: white;

}


/* =====================================================
   HEADER
   ===================================================== */

header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background: #161b22;

    border-bottom:
        1px solid #30363d;

}

.title {

    font-size: 24px;

    font-weight: bold;

}

.subtitle {

    font-size: 12px;

    color: #8b949e;

    margin-top: 3px;

}

.cloud-status {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 13px;

}

.cloud-dot {

    width: 11px;

    height: 11px;

    border-radius: 50%;

    background: #f85149;

}

.cloud-dot.online {

    background: #3fb950;

    box-shadow:
        0 0 10px #3fb950;

}


/* =====================================================
   MAIN
   ===================================================== */

main {

    padding: 25px;

}


/* =====================================================
   SUMMARY
   ===================================================== */

.summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 25px;

}

.summary-card {

    background: #161b22;

    border:
        1px solid #30363d;

    border-radius: 10px;

    padding: 18px;

}

.summary-title {

    font-size: 12px;

    color: #8b949e;

}

.summary-value {

    font-size: 28px;

    font-weight: bold;

    margin-top: 7px;

}


/* =====================================================
   DEVICES
   ===================================================== */

.devices {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(350px, 1fr)
        );

    gap: 20px;

}


/* =====================================================
   DEVICE CARD
   ===================================================== */

.device {

    background: #161b22;

    border:
        1px solid #30363d;

    border-radius: 12px;

    padding: 20px;

    transition:
        border 0.2s,
        opacity 0.2s;

}

.device.online {

    border-color: #238636;

}

.device.offline {

    opacity: 0.55;

}


/* =====================================================
   DEVICE HEADER
   ===================================================== */

.device-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

}

.motor-name {

    font-size: 21px;

    font-weight: bold;

}

.pi-id {

    font-size: 12px;

    color: #8b949e;

    margin-top: 5px;

}

.location {

    font-size: 12px;

    color: #8b949e;

    margin-top: 3px;

}


/* =====================================================
   ONLINE STATUS
   ===================================================== */

.status {

    padding:
        5px 10px;

    border-radius:
        20px;

    font-size:
        11px;

    font-weight:
        bold;

}

.status.online {

    color: #3fb950;

    background:
        #0d2818;

}

.status.offline {

    color: #f85149;

    background:
        #2d1111;

}


/* =====================================================
   DATA
   ===================================================== */

.data-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 20px;

}

.data {

    background: #0d1117;

    border-radius: 7px;

    padding: 12px;

}

.data-label {

    color: #8b949e;

    font-size: 11px;

}

.data-value {

    margin-top: 5px;

    font-size: 17px;

    font-weight: bold;

}


/* =====================================================
   BUTTONS
   ===================================================== */

.controls {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 20px;

}

button {

    border: none;

    border-radius: 7px;

    padding: 11px 8px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 12px;

}

button:hover {

    opacity: 0.85;

}

.remote {

    background: #1f6feb;

}

.local {

    background: #57606a;

}

.start {

    background: #238636;

}

.stop {

    background: #da3633;

}

.relay-on {

    background: #2ea043;

}

.relay-off {

    background: #a40e26;

}


/* =====================================================
   COMMAND STATUS
   ===================================================== */

.command-status {

    margin-top: 12px;

    padding: 9px;

    border-radius: 6px;

    background: #0d1117;

    color: #8b949e;

    font-size: 11px;

}


/* =====================================================
   EMPTY
   ===================================================== */

.empty {

    grid-column: 1 / -1;

    text-align: center;

    padding: 70px;

    color: #8b949e;

}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width: 900px) {

    .summary {

        grid-template-columns:
            1fr 1fr;

    }

}

@media(max-width: 600px) {

    .summary {

        grid-template-columns:
            1fr;

    }

    .devices {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

    <div>

        <div class="title">
            SCADA OCC
        </div>

        <div class="subtitle">
            Cloud Based Motor Monitoring & Control
        </div>

    </div>


    <div class="cloud-status">

        <span
            id="cloudDot"
            class="cloud-dot">
        </span>

        <span id="cloudText">
            Connecting...
        </span>

    </div>

</header>



<main>


<!-- =====================================================
     SUMMARY
     ===================================================== -->

<section class="summary">


    <div class="summary-card">

        <div class="summary-title">
            TOTAL DEVICES
        </div>

        <div
            id="totalDevices"
            class="summary-value">
            0
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-title">
            ONLINE DEVICES
        </div>

        <div
            id="onlineDevices"
            class="summary-value">
            0
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-title">
            MOTORS RUNNING
        </div>

        <div
            id="runningMotors"
            class="summary-value">
            0
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-title">
            TOTAL CURRENT
        </div>

        <div
            id="totalCurrent"
            class="summary-value">
            0.000 A
        </div>

    </div>


</section>



<!-- =====================================================
     DEVICES
     ===================================================== -->

<section
    id="devices"
    class="devices">

    <div class="empty">

        Waiting for Raspberry Pi devices...

    </div>

</section>


</main>



<script>

/* =========================================================
   FIREBASE CONFIGURATION
   ========================================================= */

const firebaseConfig = {

    apiKey:
        "YOUR_FIREBASE_WEB_API_KEY",

    authDomain:
        "monitoring-3fb9f.firebaseapp.com",

    databaseURL:
        "https://monitoring-3fb9f-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "monitoring-3fb9f",

    storageBucket:
        "monitoring-3fb9f.appspot.com",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_FIREBASE_APP_ID"

};


/* =========================================================
   INITIALIZE FIREBASE
   ========================================================= */

firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();


const db =
    firebase.database();


/* =========================================================
   GLOBAL DEVICE DATA
   ========================================================= */

let devices = {};


/* =========================================================
   FIREBASE AUTHENTICATION
   ========================================================= */

auth.signInAnonymously()

.then(() => {

    console.log(
        "Firebase authentication successful"
    );

    setCloudStatus(true);

    startDeviceListener();

})

.catch(error => {

    console.error(
        "Firebase authentication error:",
        error
    );

    setCloudStatus(false);

    document.getElementById(
        "cloudText"
    ).textContent =
        "Firebase authentication failed";

});


/* =========================================================
   CLOUD STATUS
   ========================================================= */

function setCloudStatus(online) {

    const dot =
        document.getElementById(
            "cloudDot"
        );

    const text =
        document.getElementById(
            "cloudText"
        );


    if (online) {

        dot.classList.add(
            "online"
        );

        text.textContent =
            "Firebase ONLINE";

    }

    else {

        dot.classList.remove(
            "online"
        );

        text.textContent =
            "Firebase OFFLINE";

    }

}


/* =========================================================
   REAL-TIME DEVICE LISTENER
   ========================================================= */

function startDeviceListener() {

    db.ref(
        "scada/devices"
    )

    .on(

        "value",

        snapshot => {

            devices =
                snapshot.val() || {};

            renderDevices();

            setCloudStatus(true);

        },

        error => {

            console.error(
                "Firebase listener error:",
                error
            );

            setCloudStatus(false);

        }

    );

}


/* =========================================================
   RENDER DEVICES
   ========================================================= */

function renderDevices() {

    const container =
        document.getElementById(
            "devices"
        );


    container.innerHTML = "";


    const ids =
        Object.keys(devices);


    let onlineCount = 0;

    let runningCount = 0;

    let totalCurrent = 0;


    if (ids.length === 0) {

        container.innerHTML = `

            <div class="empty">

                No Raspberry Pi registered.

                <br><br>

                Start the SCADA program on a
                Raspberry Pi to register it.

            </div>

        `;

        updateSummary(
            0,
            0,
            0,
            0
        );

        return;

    }


    ids.forEach(piId => {


        const device =
            devices[piId] || {};


        const online =
            device.online === true;


        const current =
            Number(
                device.current || 0
            );


        if (online) {

            onlineCount++;

        }


        totalCurrent += current;


        if (

            online &&

            String(
                device.motor_status || ""
            ).toUpperCase() ===
            "RUNNING"

        ) {

            runningCount++;

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "device " +
            (
                online
                ? "online"
                : "offline"
            );


        card.innerHTML = `

            <div class="device-header">

                <div>

                    <div class="motor-name">

                        ${escapeHTML(
                            device.motor_name ||
                            "UNKNOWN MOTOR"
                        )}

                    </div>


                    <div class="pi-id">

                        ${escapeHTML(
                            piId
                        )}

                    </div>


                    <div class="location">

                        ${escapeHTML(
                            device.location ||
                            "Location not specified"
                        )}

                    </div>

                </div>


                <div class="status ${
                    online
                    ? "online"
                    : "offline"
                }">

                    ${
                        online
                        ? "ONLINE"
                        : "OFFLINE"
                    }

                </div>

            </div>



            <div class="data-grid">


                <div class="data">

                    <div class="data-label">
                        CURRENT
                    </div>

                    <div class="data-value">

                        ${
                            current.toFixed(3)
                        }
                        A

                    </div>

                </div>



                <div class="data">

                    <div class="data-label">
                        MOTOR
                    </div>

                    <div class="data-value">

                        ${escapeHTML(
                            device.motor_status ||
                            "STOPPED"
                        )}

                    </div>

                </div>



                <div class="data">

                    <div class="data-label">
                        MODE
                    </div>

                    <div class="data-value">

                        ${escapeHTML(
                            device.mode ||
                            "LOCAL"
                        )}

                    </div>

                </div>



                <div class="data">

                    <div class="data-label">
                        RELAY
                    </div>

                    <div class="data-value">

                        ${escapeHTML(
                            device.relay ||
                            "OFF"
                        )}

                    </div>

                </div>



                <div class="data">

                    <div class="data-label">
                        LOCATION
                    </div>

                    <div class="data-value">

                        ${escapeHTML(
                            device.location ||
                            "-"
                        )}

                    </div>

                </div>



                <div class="data">

                    <div class="data-label">
                        LAST SEEN
                    </div>

                    <div class="data-value">

                        ${
                            formatTime(
                                device.last_seen
                            )
                        }

                    </div>

                </div>


            </div>



            <div class="controls">


                <button
                    class="remote"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'MODE_REMOTE'
                    )">

                    REMOTE MODE

                </button>



                <button
                    class="local"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'MODE_LOCAL'
                    )">

                    LOCAL MODE

                </button>



                <button
                    class="start"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'START'
                    )">

                    START MOTOR

                </button>



                <button
                    class="stop"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'STOP'
                    )">

                    STOP MOTOR

                </button>



                <button
                    class="relay-on"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'RELAY_ON'
                    )">

                    RELAY ON

                </button>



                <button
                    class="relay-off"
                    onclick="sendCommand(
                        '${safeId(piId)}',
                        'RELAY_OFF'
                    )">

                    RELAY OFF

                </button>


            </div>



            <div
                id="command-${safeId(piId)}"
                class="command-status">

                Ready

            </div>

        `;


        container.appendChild(
            card
        );

    });


    updateSummary(

        ids.length,

        onlineCount,

        runningCount,

        totalCurrent

    );

}


/* =========================================================
   SEND COMMAND TO RASPBERRY PI
   ========================================================= */

function sendCommand(
    piId,
    command
) {


    console.log(
        "Sending:",
        command,
        "to:",
        piId
    );


    const statusElement =
        document.getElementById(
            "command-" +
            safeId(piId)
        );


    if (statusElement) {

        statusElement.textContent =
            "Sending command: " +
            command;

    }


    const commandData = {

        command:
            command,

        timestamp:
            firebase.database
                .ServerValue
                .TIMESTAMP

    };


    db.ref(
        "scada/commands/" +
        piId
    )

    .set(
        commandData
    )

    .then(() => {


        console.log(
            "Command successfully sent"
        );


        if (statusElement) {

            statusElement.textContent =
                "Command sent: " +
                command;

        }


    })

    .catch(error => {


        console.error(
            "Command error:",
            error
        );


        if (statusElement) {

            statusElement.textContent =
                "Command failed";

        }


        alert(
            "Command failed:\n" +
            error.message
        );

    });

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary(
    total,
    online,
    running,
    current
) {


    document.getElementById(
        "totalDevices"
    ).textContent =
        total;


    document.getElementById(
        "onlineDevices"
    ).textContent =
        online;


    document.getElementById(
        "runningMotors"
    ).textContent =
        running;


    document.getElementById(
        "totalCurrent"
    ).textContent =
        current.toFixed(3) +
        " A";

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(
    timestamp
) {

    if (!timestamp) {

        return "-";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleTimeString(
        "en-IN",
        {

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   SAFE FIREBASE ID
   ========================================================= */

function safeId(
    value
) {

    return String(value)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );

}

</script>

</body>

</html>
