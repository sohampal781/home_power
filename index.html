<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Electrical SCADA</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        #020617;

    color:
        white;

    font-family:
        Arial, sans-serif;

}

.header {

    background:
        #111827;

    padding:
        20px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

}

.title {

    font-size:
        25px;

    font-weight:
        bold;

}

.time {

    font-size:
        17px;

}

.container {

    padding:
        20px;

}

.cards {

    display:
        grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:
        15px;

}

.card {

    background:
        #1e293b;

    border-radius:
        12px;

    padding:
        25px;

    text-align:
        center;

}

.card-title {

    color:
        #94a3b8;

    font-size:
        14px;

}

.card-value {

    margin-top:
        10px;

    font-size:
        28px;

    font-weight:
        bold;

}

.graph {

    margin-top:
        20px;

    background:
        #0f172a;

    border-radius:
        12px;

    padding:
        20px;

}

canvas {

    width:
        100%;

    height:
        300px;

}

.controls {

    margin-top:
        20px;

    display:
        flex;

    gap:
        15px;

}

button {

    flex:
        1;

    padding:
        18px;

    border:
        none;

    border-radius:
        8px;

    color:
        white;

    font-size:
        17px;

    font-weight:
        bold;

    cursor:
        pointer;

}

.on {

    background:
        #16a34a;

}

.off {

    background:
        #dc2626;

}

.mode {

    margin-top:
        20px;

    background:
        #1e293b;

    padding:
        20px;

    border-radius:
        12px;

}

.events {

    margin-top:
        20px;

    background:
        #111827;

    padding:
        20px;

    border-radius:
        12px;

    font-family:
        monospace;

}

@media(max-width:800px) {

    .cards {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

}

</style>

</head>


<body>


<div class="header">

    <div class="title">
        ELECTRICAL SCADA
    </div>

    <div id="time">
        --
    </div>

</div>


<div class="container">


<div class="cards">


<div class="card">

<div class="card-title">
CURRENT
</div>

<div
id="current"
class="card-value">

0.000 A

</div>

</div>


<div class="card">

<div class="card-title">
MODE
</div>

<div
id="mode"
class="card-value">

LOCAL

</div>

</div>


<div class="card">

<div class="card-title">
RELAY
</div>

<div
id="relay"
class="card-value">

OFF

</div>

</div>


<div class="card">

<div class="card-title">
ARDUINO
</div>

<div
id="arduino"
class="card-value">

OFFLINE

</div>

</div>


</div>


<div class="graph">

<h2>
Live Current
</h2>

<canvas
id="chart">

</canvas>

</div>


<div class="mode">

<h2>
System Control
</h2>

<p>
Current Mode:
<strong id="mode2">
LOCAL
</strong>
</p>

</div>


<div class="controls">

<button
class="on"
onclick="relay('ON')">

RELAY ON

</button>


<button
class="off"
onclick="relay('OFF')">

RELAY OFF

</button>

</div>


<div class="events">

<h3>
SYSTEM EVENTS
</h3>

<pre id="events">
Waiting...
</pre>

</div>


</div>


<script>


// ======================================================
// CONFIGURATION
// ======================================================

// Replace this with your secure Raspberry Pi URL.

const API_URL =
"https://YOUR-PI-ADDRESS";


// Replace with the SAME token configured
// on the Raspberry Pi.

const API_TOKEN =
"YOUR_SCADA_TOKEN";


// ======================================================
// GET STATUS
// ======================================================

async function getStatus() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/status"
            );

        const data =
            await response.json();


        document.getElementById(
            "current"
        ).innerText =
            Number(
                data.current
            ).toFixed(3)
            + " A";


        document.getElementById(
            "mode"
        ).innerText =
            data.mode;


        document.getElementById(
            "mode2"
        ).innerText =
            data.mode;


        document.getElementById(
            "relay"
        ).innerText =
            data.relay
            ? "ON"
            : "OFF";


        document.getElementById(
            "arduino"
        ).innerText =
            data.arduino
            ? "ONLINE"
            : "OFFLINE";


        document.getElementById(
            "time"
        ).innerText =
            data.time;


        document.getElementById(
            "events"
        ).innerText =
            data.events.join(
                "\n"
            );


        drawGraph(
            data.history
        );


    }

    catch(error) {

        document.getElementById(
            "arduino"
        ).innerText =
            "PI OFFLINE";

    }

}


// ======================================================
// RELAY
// ======================================================

async function relay(action) {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/relay",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-SCADA-TOKEN":
                            API_TOKEN

                    },

                    body:
                        JSON.stringify({
                            action:
                                action
                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            alert(
                result.error ||
                result.message
            );

        }


        getStatus();

    }

    catch(error) {

        alert(
            "Unable to connect to Raspberry Pi"
        );

    }

}


// ======================================================
// GRAPH
// ======================================================

function drawGraph(history) {

    const canvas =
        document.getElementById(
            "chart"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        canvas.clientWidth *
        window.devicePixelRatio;

    canvas.height =
        canvas.clientHeight *
        window.devicePixelRatio;


    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );


    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        !history ||
        history.length < 2
    ) {

        return;

    }


    const values =
        history.map(
            x =>
                Number(
                    x.value
                )
        );


    const min =
        Math.min(
            ...values
        );

    const max =
        Math.max(
            ...values
        );


    const range =
        max - min ||
        1;


    ctx.beginPath();


    values.forEach(
        (value, index) => {

            const x =
                index /
                (
                    values.length -
                    1
                )
                *
                width;


            const y =
                height -
                (
                    (
                        value -
                        min
                    )
                    /
                    range
                )
                *
                height;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#38bdf8";

    ctx.lineWidth =
        3;

    ctx.stroke();

}


// ======================================================
// AUTO UPDATE
// ======================================================

setInterval(
    getStatus,
    1000
);


getStatus();

</script>


</body>

</html>
