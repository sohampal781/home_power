<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MRPSP Building Management System</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    color: #172033;
}

/* ================= HEADER ================= */

.header {
    height: 78px;
    background: white;
    border-bottom: 1px solid #dfe5ec;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logoArea {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;

    background: #1769ff;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;
}

.systemTitle {
    font-size: 24px;
    font-weight: 700;
}

.systemSubtitle {
    font-size: 14px;
    color: #687386;
    margin-top: 3px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 16px;
    font-weight: 600;
}

.connectionDot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f04444;
}

.connectionDot.online {
    background: #16a34a;
}

/* ================= LAYOUT ================= */

.layout {
    display: flex;
    min-height: calc(100vh - 78px);
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 250px;
    background: white;
    border-right: 1px solid #dfe5ec;

    padding: 25px 16px;
}

.navTitle {
    color: #8993a4;
    font-size: 13px;
    font-weight: bold;
    margin: 5px 12px 12px;
}

.navButton {
    width: 100%;
    padding: 16px 15px;
    margin-bottom: 8px;

    border: none;
    background: transparent;

    text-align: left;

    border-radius: 10px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.navButton:hover {
    background: #eef4ff;
}

.navButton.active {
    background: #e9f1ff;
    color: #1769ff;
}

.onlineCount {
    margin-top: 35px;

    background: #f5f8fc;
    border-radius: 12px;

    padding: 18px;
}

.onlineCountTitle {
    font-size: 14px;
    color: #687386;
}

.onlineCountNumber {
    font-size: 34px;
    font-weight: 700;
    margin-top: 5px;
}

/* ================= MAIN ================= */

.main {
    flex: 1;
    padding: 30px;
    overflow-x: hidden;
}

.page {
    max-width: 1600px;
    margin: auto;
}

.pageTitle {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
}

.pageDescription {
    font-size: 16px;
    color: #697586;
    margin-bottom: 30px;
}

/* ================= SUMMARY ================= */

.summaryGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;

    margin-bottom: 35px;
}

.summaryCard {
    background: white;
    border: 1px solid #e0e6ee;
    border-radius: 16px;

    padding: 24px;

    min-height: 125px;
}

.summaryLabel {
    font-size: 15px;
    color: #6b7585;
}

.summaryValue {
    font-size: 34px;
    font-weight: 700;
    margin-top: 12px;
}

/* ================= ROOMS ================= */

.sectionHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}

.sectionTitle {
    font-size: 24px;
    font-weight: 700;
}

.roomGrid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(340px, 1fr));

    gap: 24px;
}

.roomCard {
    background: white;

    border: 2px solid #dfe5ec;

    border-radius: 18px;

    padding: 25px;

    cursor: pointer;

    transition: 0.2s;
}

.roomCard:hover {
    transform: translateY(-3px);
    border-color: #1769ff;
    box-shadow: 0 8px 25px rgba(30,60,100,0.10);
}

.roomTop {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.roomName {
    font-size: 27px;
    font-weight: 700;
}

.onlineBadge {
    padding: 8px 13px;

    border-radius: 20px;

    background: #dcfce7;
    color: #15803d;

    font-size: 14px;
    font-weight: 700;
}

.offlineBadge {
    padding: 8px 13px;

    border-radius: 20px;

    background: #fee2e2;
    color: #b91c1c;

    font-size: 14px;
    font-weight: 700;
}

.supplyStatus {
    font-size: 21px;
    font-weight: 700;

    margin-bottom: 20px;
}

.supplyOn {
    color: #15803d;
}

.supplyOff {
    color: #b91c1c;
}

.measureGrid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.measure {
    background: #f6f8fb;

    border-radius: 12px;

    padding: 15px;
}

.measureLabel {
    font-size: 13px;
    color: #697586;
}

.measureValue {
    font-size: 21px;
    font-weight: 700;

    margin-top: 7px;
}

.roomFooter {
    border-top: 1px solid #e5e9ef;

    margin-top: 20px;
    padding-top: 15px;

    font-size: 14px;
    color: #687386;
}

/* ================= WAITING ================= */

.waiting {
    background: white;

    border: 2px dashed #cdd5df;

    border-radius: 18px;

    padding: 70px 30px;

    text-align: center;

    font-size: 21px;
    color: #687386;
}

.waitingIcon {
    font-size: 50px;
    margin-bottom: 15px;
}

/* ================= REGISTER PAGE ================= */

.registerPanel {
    background: white;

    border: 1px solid #dfe5ec;

    border-radius: 18px;

    padding: 28px;
}

.registerTop {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.bigButton {
    border: none;

    padding: 15px 24px;

    border-radius: 10px;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.scanButton {
    background: #1769ff;
    color: white;
}

.scanButton:hover {
    background: #0e56d8;
}

.deviceList {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(350px, 1fr));

    gap: 18px;
}

.detectedDevice {
    border: 2px solid #e0e6ee;

    border-radius: 15px;

    padding: 22px;

    background: #fbfcfe;
}

.deviceName {
    font-size: 23px;
    font-weight: 700;
}

.deviceTopic {
    font-size: 13px;

    color: #718096;

    margin-top: 8px;

    word-break: break-all;
}

.deviceStatus {
    margin-top: 15px;

    font-size: 16px;
    font-weight: 600;
}

.registered {
    margin-top: 15px;

    color: #15803d;
    font-weight: 700;
}

.registerDeviceButton {
    margin-top: 15px;

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #1769ff;
    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

/* ================= REGISTERED LIST ================= */

.registeredSection {
    margin-top: 35px;
}

.registeredRow {
    display: flex;

    align-items: center;
    justify-content: space-between;

    background: #f7f9fc;

    border: 1px solid #dfe5ec;

    border-radius: 12px;

    padding: 17px 20px;

    margin-bottom: 10px;
}

.registeredName {
    font-size: 19px;
    font-weight: 700;
}

.deleteButton {
    background: #fee2e2;
    color: #b91c1c;

    border: none;

    padding: 10px 16px;

    border-radius: 8px;

    font-weight: 700;

    cursor: pointer;
}

/* ================= DETAIL PAGE ================= */

.backButton {
    border: none;

    background: white;

    border: 1px solid #dfe5ec;

    padding: 12px 18px;

    border-radius: 9px;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    margin-bottom: 20px;
}

.detailHeader {
    background: white;

    border-radius: 18px;

    border: 1px solid #dfe5ec;

    padding: 28px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.detailRoomName {
    font-size: 36px;
    font-weight: 700;
}

.detailStatus {
    margin-top: 8px;

    font-size: 17px;
    color: #687386;
}

.detailGrid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;

    margin-bottom: 25px;
}

.detailValueCard {
    background: white;

    border: 1px solid #dfe5ec;

    border-radius: 16px;

    padding: 25px;
}

.detailValueLabel {
    font-size: 15px;
    color: #687386;
}

.detailValue {
    font-size: 35px;
    font-weight: 700;

    margin-top: 12px;
}

.detailColumns {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;
}

.detailPanel {
    background: white;

    border: 1px solid #dfe5ec;

    border-radius: 18px;

    padding: 25px;
}

.panelTitle {
    font-size: 23px;
    font-weight: 700;

    margin-bottom: 22px;
}

.infoRow {
    display: flex;

    justify-content: space-between;

    padding: 15px 0;

    border-bottom: 1px solid #edf0f4;

    font-size: 17px;
}

.infoValue {
    font-weight: 700;
}

.controlButton {
    width: 100%;

    padding: 17px;

    margin-bottom: 12px;

    border: none;

    border-radius: 10px;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;
}

.onButton {
    background: #dcfce7;
    color: #15803d;
}

.offButton {
    background: #fee2e2;
    color: #b91c1c;
}

.statusButton {
    background: #e9f1ff;
    color: #1769ff;
}

.resetButton {
    background: #f1f5f9;
    color: #334155;
}

/* ================= RESPONSIVE ================= */

@media(max-width: 1100px) {

    .summaryGrid {
        grid-template-columns: repeat(2, 1fr);
    }

    .detailGrid {
        grid-template-columns: repeat(2, 1fr);
    }

    .sidebar {
        width: 210px;
    }
}

@media(max-width: 750px) {

    .sidebar {
        display: none;
    }

    .main {
        padding: 18px;
    }

    .summaryGrid {
        grid-template-columns: 1fr;
    }

    .detailGrid {
        grid-template-columns: 1fr;
    }

    .detailColumns {
        grid-template-columns: 1fr;
    }

    .systemTitle {
        font-size: 18px;
    }

    .roomGrid {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 0 15px;
    }

    .connection {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<header class="header">

    <div class="logoArea">

        <div class="logo">
            ⚡
        </div>

        <div>
            <div class="systemTitle">
                MRPSP BUILDING MANAGEMENT SYSTEM
            </div>

            <div class="systemSubtitle">
                Remote Electrical Monitoring & Control
            </div>
        </div>

    </div>

    <div class="connection">

        <span
            id="connectionDot"
            class="connectionDot">
        </span>

        <span id="connectionText">
            Connecting...
        </span>

    </div>

</header>


<!-- ========================================================= -->
<!-- LAYOUT -->
<!-- ========================================================= -->

<div class="layout">


<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<aside class="sidebar">

    <div class="navTitle">
        BUILDING
    </div>

    <button
        class="navButton active"
        onclick="showDashboard()">

        🏢 Overview

    </button>


    <button
        class="navButton"
        onclick="showRegister()">

        ⚙ Register ESP

    </button>


    <button
        class="navButton"
        onclick="showRegistered()">

        📋 Registered ESPs

    </button>


    <button
        class="navButton"
        onclick="showEvents()">

        ⚠ Events

    </button>


    <div class="onlineCount">

        <div class="onlineCountTitle">
            ONLINE REGISTERED ESP
        </div>

        <div
            class="onlineCountNumber"
            id="sideOnlineCount">

            0

        </div>

    </div>

</aside>


<!-- ========================================================= -->
<!-- MAIN -->
<!-- ========================================================= -->

<main class="main">

<div class="page" id="app">

    <!-- Dashboard will be inserted here -->

</div>

</main>

</div>


<script>

/* =========================================================
   MQTT CONFIGURATION
========================================================= */

const MQTT_URL =
    "wss://test.mosquitto.org:8081/mqtt";


const DATA_TOPIC =
    "mrpsp/building01/devices/+/data";


const STATUS_TOPIC =
    "mrpsp/building01/devices/+/status";


const COMMAND_BASE =
    "mrpsp/building01/devices/";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "MRPSP_REGISTERED_ESPS";


let registeredESPs =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );


/* =========================================================
   LIVE DEVICES
========================================================= */

let liveDevices = {};


let selectedRoom = null;


/* =========================================================
   MQTT
========================================================= */

let mqttClient;


function connectMQTT() {

    updateConnection(
        false,
        "Connecting..."
    );


    mqttClient = mqtt.connect(
        MQTT_URL,
        {
            clientId:
                "MRPSP_BMS_" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean: true,

            reconnectPeriod: 3000,

            connectTimeout: 10000
        }
    );


    mqttClient.on(
        "connect",
        function() {

            updateConnection(
                true,
                "MQTT ONLINE"
            );


            mqttClient.subscribe(
                DATA_TOPIC
            );


            mqttClient.subscribe(
                STATUS_TOPIC
            );


            console.log(
                "MQTT connected"
            );

        }
    );


    mqttClient.on(
        "message",
        function(topic, message) {

            processMQTTMessage(
                topic,
                message.toString()
            );

        }
    );


    mqttClient.on(
        "error",
        function(error) {

            console.log(
                "MQTT Error:",
                error
            );

        }
    );


    mqttClient.on(
        "offline",
        function() {

            updateConnection(
                false,
                "MQTT OFFLINE"
            );

        }
    );

}


function updateConnection(
    online,
    text
) {

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const label =
        document.getElementById(
            "connectionText"
        );


    if (online) {

        dot.classList.add(
            "online"
        );

    } else {

        dot.classList.remove(
            "online"
        );

    }


    label.textContent = text;

}


/* =========================================================
   MQTT MESSAGE PROCESSING
========================================================= */

function processMQTTMessage(
    topic,
    payload
) {

    const parts =
        topic.split("/");


    /*
       Topic format:

       mrpsp
       building01
       devices
       ROOM_01
       data/status
    */


    if (
        parts.length < 5
    ) {

        return;

    }


    const deviceName =
        parts[3];


    const messageType =
        parts[4];


    if (!deviceName) {

        return;

    }


    /* -----------------------------------------------------
       STATUS MESSAGE
    ----------------------------------------------------- */

    if (
        messageType === "status"
    ) {

        const status =
            payload
                .trim()
                .toUpperCase();


        if (
            status === "OFFLINE"
        ) {

            /*
               Remove immediately from
               live dashboard.
            */

            delete liveDevices[
                deviceName
            ];


            updateUI();

            return;

        }


        if (
            status === "ONLINE"
        ) {

            /*
               Do NOT create the room
               from retained ONLINE alone.

               The DATA heartbeat must arrive.
            */

            if (
                liveDevices[
                    deviceName
                ]
            ) {

                liveDevices[
                    deviceName
                ].status =
                    "ONLINE";

            }

            updateUI();

        }

        return;

    }


    /* -----------------------------------------------------
       DATA MESSAGE
    ----------------------------------------------------- */

    if (
        messageType === "data"
    ) {

        try {

            const data =
                JSON.parse(payload);


            /*
               DATA message acts as
               registration heartbeat.
            */

            if (
                !isRegistered(
                    deviceName
                )
            ) {

                /*
                   ESP is detected but not
                   registered.

                   It will appear only in
                   Register ESP page.
                */

                return;

            }


            liveDevices[
                deviceName
            ] = {

                ...data,

                device_id:
                    deviceName,

                name:
                    data.name ||
                    deviceName,

                lastSeen:
                    Date.now(),

                status:
                    "ONLINE"

            };


            updateUI();

        }

        catch(error) {

            console.log(
                "Invalid JSON:",
                payload
            );

        }

    }

}


/* =========================================================
   REGISTERED CHECK
========================================================= */

function isRegistered(
    deviceName
) {

    return registeredESPs.includes(
        deviceName
    );

}


/* =========================================================
   SAVE REGISTRATION
========================================================= */

function saveRegistered() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            registeredESPs
        )
    );

}


/* =========================================================
   REGISTER ESP
========================================================= */

function registerESP(
    deviceName
) {

    if (
        !isRegistered(
            deviceName
        )
    ) {

        registeredESPs.push(
            deviceName
        );

        saveRegistered();

        alert(
            deviceName +
            " registered successfully."
        );

        updateUI();

    }

}


/* =========================================================
   DELETE ESP
========================================================= */

function deleteESP(
    deviceName
) {

    const confirmDelete =
        confirm(
            "Delete " +
            deviceName +
            " from registered ESPs?"
        );


    if (!confirmDelete) {

        return;

    }


    registeredESPs =
        registeredESPs.filter(
            function(name) {

                return name !==
                    deviceName;

            }
        );


    /*
       Remove it immediately
       from live dashboard.
    */

    delete liveDevices[
        deviceName
    ];


    saveRegistered();


    updateUI();

}


/* =========================================================
   CHECK ONLINE TIMEOUT
========================================================= */

function removeOfflineDevices() {

    const now =
        Date.now();


    const TIMEOUT =
        7000;


    Object.keys(
        liveDevices
    ).forEach(
        function(deviceName) {

            if (
                now -
                liveDevices[
                    deviceName
                ].lastSeen
                >
                TIMEOUT
            ) {

                delete liveDevices[
                    deviceName
                ];

            }

        }
    );


    updateUI();

}


setInterval(
    removeOfflineDevices,
    2000
);


/* =========================================================
   DASHBOARD
========================================================= */

function showDashboard() {

    selectedRoom = null;


    setActiveNav(0);


    renderDashboard();

}


function renderDashboard() {

    const app =
        document.getElementById(
            "app"
        );


    const devices =
        Object.values(
            liveDevices
        );


    const onlineCount =
        devices.length;


    let totalPower = 0;

    let totalCurrent = 0;

    let supplyOn = 0;


    devices.forEach(
        function(device) {

            totalPower +=
                Number(
                    device.power || 0
                );

            totalCurrent +=
                Number(
                    device.current || 0
                );


            if (
                String(
                    device.status
                ).toUpperCase()
                === "ON"
            ) {

                supplyOn++;

            }

        }
    );


    app.innerHTML = `

        <div class="pageTitle">
            Building Overview
        </div>

        <div class="pageDescription">
            Only registered and currently online ESP controllers are displayed.
        </div>


        <div class="summaryGrid">

            <div class="summaryCard">

                <div class="summaryLabel">
                    Online Rooms
                </div>

                <div class="summaryValue">
                    ${onlineCount}
                </div>

            </div>


            <div class="summaryCard">

                <div class="summaryLabel">
                    Supply ON
                </div>

                <div class="summaryValue">
                    ${supplyOn}
                </div>

            </div>


            <div class="summaryCard">

                <div class="summaryLabel">
                    Total Current
                </div>

                <div class="summaryValue">
                    ${totalCurrent.toFixed(2)} A
                </div>

            </div>


            <div class="summaryCard">

                <div class="summaryLabel">
                    Total Power
                </div>

                <div class="summaryValue">
                    ${totalPower.toFixed(1)} W
                </div>

            </div>

        </div>


        <div class="sectionHeader">

            <div class="sectionTitle">
                Online Registered Rooms
            </div>

        </div>


        <div
            id="roomContainer"
            class="roomGrid">

            ${
                devices.length === 0
                ?
                `
                <div class="waiting">

                    <div class="waitingIcon">
                        📡
                    </div>

                    Waiting for online registered ESP controllers...

                    <br>

                    <span style="
                        font-size:15px;
                        display:block;
                        margin-top:10px;
                    ">
                        Go to "Register ESP" to register a detected controller.
                    </span>

                </div>
                `
                :
                devices
                    .map(
                        createRoomCard
                    )
                    .join("")
            }

        </div>
    `;


    updateSideCount();

}


/* =========================================================
   ROOM CARD
========================================================= */

function createRoomCard(
    device
) {

    const name =
        device.name ||
        device.device_id;


    const supply =
        String(
            device.status ||
            "UNKNOWN"
        ).toUpperCase();


    const supplyClass =
        supply === "ON"
        ?
        "supplyOn"
        :
        "supplyOff";


    return `

        <div
            class="roomCard"
            onclick="openRoom('${escapeJS(name)}')"
        >

            <div class="roomTop">

                <div class="roomName">
                    ${escapeHTML(name)}
                </div>

                <div class="onlineBadge">
                    ● ONLINE
                </div>

            </div>


            <div class="
                supplyStatus
                ${supplyClass}
            ">

                ${
                    supply === "ON"
                    ?
                    "● SUPPLY ON"
                    :
                    "● SUPPLY OFF"
                }

            </div>


            <div class="measureGrid">

                <div class="measure">

                    <div class="measureLabel">
                        Voltage
                    </div>

                    <div class="measureValue">
                        ${Number(
                            device.voltage || 0
                        ).toFixed(1)}
                        V
                    </div>

                </div>


                <div class="measure">

                    <div class="measureLabel">
                        Current
                    </div>

                    <div class="measureValue">

========================================================= */

function sendCommand(
    command
) {

    if (
        !mqttClient ||
        !mqttClient.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;

    }


    if (!selectedRoom) {

        return;

    }


    const topic =
        COMMAND_BASE +
        selectedRoom +
        "/command";


    mqttClient.publish(
        topic,
        command
    );


    console.log(
        "Command sent:",
        topic,
        command
    );

}

function getDetectedDevices() {

    const result = [];


    /*
       liveDevices only contains
       devices that are actively
       sending data.

       For registration we need
       unregistered devices too.

       Therefore we keep a separate
       discovery list.
    */

    Object.keys(
        discoveredDevices
    ).forEach(
        function(name) {

            result.push(
                discoveredDevices[name]
            );

        }
    );


    return result;

}


/* =========================================================
   DISCOVERY LIST
========================================================= */

let discoveredDevices = {};


/*
   Modify MQTT processing so every
   DATA message is also discovered.
*/


const originalProcessMQTTMessage =
    processMQTTMessage;


/*
   Replace function behavior by
   wrapping MQTT message handler.
*/


mqttClient = null;


/* Reconnect with custom handler below */

function startMQTT() {

    updateConnection(
        false,
        "Connecting..."
    );


    mqttClient = mqtt.connect(
        MQTT_URL,
        {
            clientId:
                "MRPSP_BMS_" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean: true,

            reconnectPeriod: 3000,

            connectTimeout: 10000
        }
    );


    mqttClient.on(
        "connect",
        function() {

            updateConnection(
                true,
                "MQTT ONLINE"
            );


            mqttClient.subscribe(
                DATA_TOPIC
            );


            mqttClient.subscribe(
                STATUS_TOPIC
            );

        }
    );


    mqttClient.on(
        "message",
        function(topic, message) {

            const payload =
                message.toString();

            const parts =
                topic.split("/");


            if (
                parts.length >= 5
            ) {

                const deviceName =
                    parts[3];

                const type =
                    parts[4];


                if (
                    type === "data"
                ) {

                    try {

                        const data =
                            JSON.parse(
                                payload
                            );


                        /*
                           Store every ESP
                           discovered from
                           live MQTT data.
                        */

                        discoveredDevices[
                            deviceName
                        ] = {

                            ...data,

                            device_id:
                                deviceName,

                            name:
                                data.name ||
                                deviceName,

                            lastSeen:
                                Date.now()

                        };


                    }
                    catch(e) {}

                }

            }


            /*
               Now process normal
               dashboard logic.
            */

            processMQTTMessage(
                topic,
                payload
            );


            /*
               If registration page
               is open, refresh it.
            */

            if (
                document.querySelector(
                    ".registerPanel"
                )
            ) {

                renderRegisterPage();

            }

        }
    );


    mqttClient.on(
        "offline",
        function() {

            updateConnection(
                false,
                "MQTT OFFLINE"
            );

        }
    );

}


function createDetectedDevice(

    const name =

    const alreadyRegistered =

    `;

}

    if (

            liveDevices[
                selectedRoom

        ) {

            renderRoomDetail();

        } else {

            showDashboard();

        }

        return;

    }


    const registerPanel =
        document.querySelector(
            ".registerPanel"
        );


    if (registerPanel) {

        /*
           Do not force a page
           change while user is
           registering.
        */

        renderRegisterPage();

        return;

    }


    renderDashboard();

}


function updateSideCount() {

    const count =
        Object.keys(
            liveDevices
        ).length;


    const element =
        document.getElementById(
            "sideOnlineCount"
        );


    if (element) {

        element.textContent =
            count;

    }

}


/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJS(
    text
) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}
